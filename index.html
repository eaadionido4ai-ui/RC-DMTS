/* ---- Manpower check-in and deployment ---- */
const ACCRED={
  SAR:['Search and Rescue','var(--red)'],
  IC:['Incident Command','var(--gab)'],
  MED:['Medical','var(--go)'],
  SAFE:['Safety','var(--amber)'],
  COMM:['Communications','var(--itala)'],
};
/* Which accreditations may activate a beacon on someone else's device. */
const BEACON_AUTH=['SAR','IC'];
/* Covert activation is a heavier act than a loud one, so it sits behind
   Incident Command authority and a recorded justification. */
const COVERT_AUTH=['IC'];
const BMODES={
  overt:{l:'Overt', c:'var(--red)', short:'Sound and screen',
    d:'The phone sounds a loud repeating beep and pulses bright. The person holding it, and anyone nearby, knows it is on. This is the fastest way for a search team to find someone under rubble or behind a door.'},
  silent:{l:'Silent', c:'var(--sipat)', short:'Screen only, no sound',
    d:'No sound. The phone pulses and shows the person that locating is on, and keeps reporting its position on the network. Use it when noise would draw a threat but the person is conscious and can cooperate.'},
  covert:{l:'Covert', c:'var(--kamalig)', short:'Nothing on the subject device',
    d:'No sound and nothing on the screen. The person holding the phone is not told. The position reports only to the command side. This exists for cases where alerting the holder, or anyone watching them, would put them in danger.'},
};
function bmodeOf(d){ return d.bmode || (d.silent?'silent':'overt'); }
function covertOperators(){
  return S.kamalig.manpower.filter(m=>m.in && (m.accred||[]).some(a=>COVERT_AUTH.indexOf(a)>=0));
}
function canCovert(){ const op=actingOperator(); return !!op && (op.accred||[]).some(a=>COVERT_AUTH.indexOf(a)>=0); }
/* Seed accreditation from the ICS role, so the demo roster is realistic.
   Personnel added by hand are accredited explicitly on the form. */
function accredFor(role){
  const r=(role||'').toLowerCase(), a=[];
  if(/search and rescue|rescue/.test(r))a.push('SAR');
  if(/incident commander|operations section chief|deputy/.test(r))a.push('IC');
  if(/medical|first aid|nurse|clinic/.test(r))a.push('MED');
  if(/safety/.test(r))a.push('SAFE');
  if(/comms|communication|radio/.test(r))a.push('COMM');
  return a;
}
function accredChips(list){
  return (list||[]).map(k=>{const m=ACCRED[k]; if(!m)return '';
    return `<span class="srcx" style="background:color-mix(in srgb,${m[1]} 18%,var(--ink));color:${m[1]}">${k}</span>`;}).join('');
}
/* Personnel who are checked in and carry an accreditation that permits activation. */
function beaconOperators(){
  return S.kamalig.manpower.filter(m=>m.in && (m.accred||[]).some(a=>BEACON_AUTH.indexOf(a)>=0));
}
function actingOperator(){
  const ops=beaconOperators();
  if(!ops.length)return null;
  const chosen=ops.find(o=>o.id===S.rescue.actingAs);
  return chosen||ops[0];
}
function mpRoll(){
  const m=S.kamalig.manpower, hc=p=>Math.max(1,p.size||1);
  const sum=f=>m.filter(f).reduce((n,p)=>n+hc(p),0);
  const inCt=sum(p=>p.in);
  return {total:sum(()=>true), entries:m.length, inCt,
    deployed:sum(p=>p.in&&p.status==='deployed'),
    avail:sum(p=>p.in&&p.status==='available'),
    notIn:sum(p=>!p.in)};
}
function kamManpower(){
  const r=mpRoll();
  const pipe=[['Checked in',r.inCt,'var(--go)'],['Available',r.avail,'var(--sipat)'],['Deployed',r.deployed,'var(--orange)'],['Not in',r.notIn,'var(--grey)']]
    .map(([l,n,c])=>`<div class="pipe-seg"><b style="color:${c}">${n}</b><span>${l}</span></div>`).join('<div class="pipe-arrow">&middot;</div>');
  const sections=[...new Set(S.kamalig.manpower.map(p=>p.section))];
  const groups=sections.map(sec=>{
    const rows=S.kamalig.manpower.filter(p=>p.section===sec).map(mpRow).join('');
    return `<div style="margin-top:14px"><div class="eyebrow" style="margin-bottom:8px">${esc(sec)}</div><div class="reqlist">${rows}</div></div>`;
  }).join('');
  const ext=S.kamalig.manpower.filter(p=>(p.src||'internal')==='external');
  const teams=S.kamalig.manpower.filter(p=>p.kind==='team');
  return `<div class="sat-toolbar"><div class="sat-tools">
      <button class="btn sat-btn primary" onclick="mpOpen()">Add personnel or team</button>
    </div><div class="sat-hint">${r.total} personnel on the roster · ${teams.length} team${teams.length===1?'':'s'} · ${ext.length} from outside</div></div>
    <div class="pipe card">${pipe}</div>
    ${groups}
    <div class="flow-note" style="margin-top:16px">Personnel with a predetermined IMT role flow in from the iTALA evacuation scan: as each is checked in, they appear here automatically. Others can be added directly, either as an individual or as a whole team counted by its strength. Every entry records whether it is campus personnel or outside help, which is what makes mutual aid auditable when the operation closes. Deploy an available member to a task and location and their status and assignment are tracked live.</div>`;
}

function mpSave(id){
  if(frozen('Editing the roster'))return;
  const name=(document.getElementById('mpName').value||'').trim();
  if(!name){ toast('Give the person or team a name first.'); return; }
  const kind=document.getElementById('mpKind').value;
  const role=(document.getElementById('mpRole').value||'').trim()||'Responder';
  const section=document.getElementById('mpSection').value;
  const size=kind==='team'?Math.max(1,parseInt(document.getElementById('mpSize').value)||1):1;
  const src=document.getElementById('mpSrc').value;
  const org=src==='external'?((document.getElementById('mpOrg').value||'').trim()||'External organization'):'';
  const inNow=document.getElementById('mpIn').checked;
  const accred=[...document.querySelectorAll('#mpAccred .tog.on')].map(b=>b.dataset.a);
  const m=id?S.kamalig.manpower.find(x=>x.id===id):null;
  if(m){
    Object.assign(m,{name,kind,role,section,size,src,org,accred,in:inNow});
    if(!inNow){ m.status='available'; m.assign=null; }
    logEvent('resource','Roster entry updated: '+name+' ('+role+', '+(kind==='team'?size+' pax team':'individual')+', '+(src==='external'?'external from '+org:'internal')+').');
  } else {
    S.kamalig.manpower.push({id:'m'+Date.now().toString(36), name, kind, role, section, size, src, org, accred,
      in:inNow, status:'available', assign:null});
    logEvent('resource','Roster entry added: '+name+' ('+role+', '+(kind==='team'?size+' pax team':'individual')+', '+(src==='external'?'external from '+org:'internal')+').');
  }
  const dr=document.querySelector('.drawer'); if(dr)dr.remove();
  toast(m?'Roster entry updated.':(kind==='team'?'Team added to the roster.':'Personnel added to the roster.'));
  render();
}
function mpDelete(id){
  if(frozen('Editing the roster'))return;
  const m=S.kamalig.manpower.find(x=>x.id===id); if(!m)return;
  if(m.status==='deployed'){ toast('Recall them from their assignment before removing.'); return; }
  S.kamalig.manpower=S.kamalig.manpower.filter(x=>x.id!==id);
  logEvent('resource','Roster entry removed: '+m.name+'.');
  const dr=document.querySelector('.drawer'); if(dr)dr.remove();
  toast('Removed from the roster.');

function kamRequests(){
  const rs=S.kamalig.requests;
  const pipe=KSTAGES.map(s=>{
    const n=rs.filter(r=>r.status===s.k).length;
    return `<div class="pipe-seg"><b style="color:${s.c}">${n}</b><span>${s.l}</span></div>`;
  }).join('<div class="pipe-arrow">&rsaquo;</div>');
  const order=KSTAGES.map(s=>s.k);
  const sorted=[...rs].sort((a,b)=>{
    const d=order.indexOf(a.status)-order.indexOf(b.status);
    if(d)return d;
    return (a.priority==='urgent'?0:1)-(b.priority==='urgent'?0:1);
  });
  return `<div class="pipe card">${pipe}</div>
    <div class="reqlist">${sorted.map(kamRow).join('')}</div>

}

const VTYPES=['Ambulance (BLS)','Ambulance (ALS)','Fire truck','Water tanker','Rescue vehicle',
  'Heavy equipment (backhoe or loader)','Transport bus or coaster','Patrol or security vehicle','Boat or watercraft'];
const VFACILITIES=['UP Health Service','Philippine General Hospital','Nearest district hospital (configure)','Other receiving facility (configure)'];
/* A vehicle can only help if it can physically reach the place. SIPAT already
   holds the access routes, so the request form reads them before the request
   is even raised. */
function vehAccess(locName,vtype){
  const b=SIPAT.buildings.find(x=>x.name===locName);
  if(!b) return {state:'none', msg:'No building access record for this location. Confirm the approach with the marshal on the ground.'};
  const routes=(b.routes||[]).filter(r=>r.mode!=='foot');
  if(!routes.length) return {state:'none', msg:'No vehicle route recorded for '+b.name+' yet. Add one in SIPAT so drivers are not guessing.'};
  const amb=/Ambulance/i.test(vtype||'');
  const fit=routes.filter(r=>amb? (r.mode==='ambulance'||r.mode==='vehicle') : true);
  const open=fit.filter(r=>r.status!=='blocked');
  if(!open.length) return {state:'blocked', msg:'Every vehicle route to '+b.name+' is currently blocked. Clear a route or nominate a transfer point before dispatching.'};
  const clear=open.filter(r=>r.status==='clear');
  const best=(clear[0]||open[0]);
  return {state:clear.length?'clear':'restricted',
    msg:(clear.length?'Vehicle access to '+b.name+' is open via '+best.name+' from '+best.from+'.'
      :'Vehicle access to '+b.name+' is restricted. Best available is '+best.name+' from '+best.from+(best.note?', '+best.note:'')+'.')};
}

           <div class="field"><label>Priority</label><select onchange="kamDraft('priority',this.value)">

             <option value="urgent" ${d.priority==='urgent'?'selected':''}>Urgent</option></select></div>
         </div>

         <div class="short-note" style="margin-bottom:12px">This item is not in the storehouse, so the request will route to Liaison for external sourcing once the Incident Commander approves it.</div>`:''}
         <div class="grid2">
           <div class="field"><label>Quantity</label><input type="number" min="1" value="${d.qty}" oninput="kamDraft('qty',this.value)"></div>
           <div class="field"><label>Priority</label><select onchange="kamDraft('priority',this.value)">
             <option value="routine" ${d.priority==='routine'?'selected':''}>Routine</option>
             <option value="urgent" ${d.priority==='urgent'?'selected':''}>Urgent</option></select></div>

function kamDraft(k,v){ if(!S.kamalig.draft)S.kamalig.draft={}; S.kamalig.draft[k]=(k==='qty'?Math.max(1,parseInt(v)||1):v); if(['kind','invId','role','vtype','srcKind','loc'].indexOf(k)>=0)render(); }
function kamSubmit(){
  if(frozen('Raising a request'))return;
  const d=S.kamalig.draft||{};
  /* never reuse an identifier, even if a restored counter has fallen behind */
  let id;
  do { id='RR-'+String(S.kamalig.seq++).padStart(3,'0'); }
  while(S.kamalig.requests.some(r=>r.id===id));
  const note=(d.note||'').trim();
  if(d.kind==='vehicle'){
    const custom=d.vtype==='__other';
    const vtype=custom?((d.otherV||'').trim()||'Unspecified vehicle'):(d.vtype||VTYPES[0]);
    const amb=/Ambulance/i.test(vtype), fire=/Fire truck|Water tanker/i.test(vtype);
    const fleet=d.srcKind==='fleet';
    S.kamalig.requests.push({id, kind:'vehicle', vtype, item:vtype, qty:d.qty||1, invId:null,
      by:d.by||'Operations', forNeed:(d.forNeed||'').trim()||'Unspecified need', loc:d.loc||'Assembly area', link:null,
      priority:d.priority||'routine', status:'requested', cost:0, note, custom,
      fleet, agency:fleet?'':((d.agency||'').trim()||'External agency'),
      patients:amb?Math.max(0,parseInt(d.patients)||0):null, facility:amb?(d.facility||VFACILITIES[0]):'',
      water:fire?(d.water||''):''});
  } else if(d.kind==='manpower'){
    const custom=d.role==='__other';
    const role=custom?((d.otherRole||'').trim()||'Unspecified team'):(d.role||'Personnel');
    S.kamalig.requests.push({id, kind:'manpower', role, item:role+' personnel', qty:d.qty||1, invId:null,
      by:d.by||'Operations', forNeed:(d.forNeed||'').trim()||'Unspecified need', loc:d.loc||'Assembly area', link:null,
      priority:d.priority||'routine', status:'requested', cost:0, note, custom});
  } else {
    const custom=d.invId==='__other';
    if(custom){
      const item=(d.otherItem||'').trim()||'Unspecified item';
      S.kamalig.requests.push({id, kind:'supply', item, qty:d.qty||1, invId:null,
        by:d.by||'Operations', forNeed:(d.forNeed||'').trim()||'Unspecified need', loc:d.loc||'Assembly area', link:null,
        priority:d.priority||'routine', status:'requested', cost:0, note, custom:true});
    } else {
      const inv=S.kamalig.inventory.find(i=>i.id===d.invId)||S.kamalig.inventory[0];
      S.kamalig.requests.push({id, kind:'supply', item:inv.name.replace(/\s*\(.*\)/,''), qty:d.qty||1, invId:inv.id,
        by:d.by||'Operations', forNeed:(d.forNeed||'').trim()||'Unspecified need', loc:d.loc||'Assembly area', link:null,
        priority:d.priority||'routine', status:'requested', cost:0, note, custom:false});
    }
  }
  S.kamalig.draft=null;
  S.kamalig.tab='requests';
  const last=S.kamalig.requests[S.kamalig.requests.length-1];
  logEvent('resource','Request '+id+' raised: '+last.item+' '+(last.kind==='manpower'?last.qty+' pax':'x'+last.qty)+' to '+last.loc+'.');
  toast(id+' raised.');
  render();
}

function openReq(id){
  const r=S.kamalig.requests.find(x=>x.id===id); if(!r)return;
  const manpower=r.kind==='manpower', vehicle=r.kind==='vehicle';
  const inv=(manpower||vehicle)?null:S.kamalig.inventory.find(i=>i.id===r.invId);
  const avail=mpRoll().avail;
  const inStock = manpower? (avail>=r.qty) : (inv? inv.qty>=r.qty : false);
  const cur=KSTAGES.findIndex(x=>x.k===r.status);
  const steps=KSTAGES.map((s,i)=>{
    const done=i<cur, active=i===cur;
    let l=s.l;
    if(manpower){ if(s.k==='released')l='Filled'; if(s.k==='delivered')l='On scene'; if(s.k==='sourcing')l='Mutual aid'; if(s.k==='liquidated')l='Closed'; }
    if(vehicle){ if(s.k==='released')l='Dispatched'; if(s.k==='delivered')l='On scene'; if(s.k==='sourcing')l='Agency tasked'; if(s.k==='liquidated')l='Released'; }
    return `<div class="step ${done?'done':''} ${active?'active':''}">
      <span class="sdot" style="background:${done||active?s.c:'var(--ink-3)'}"></span><span class="sl">${l}</span></div>`;
  }).join('<span class="sline"></span>');
  let actions='';
  if(r.status==='requested'){
    actions=`<button class="btn primary" onclick="advReq('${id}','approved')">Approve (IC)</button>
             <button class="btn" onclick="advReq('${id}','denied')">Deny</button>`;
  } else if(r.status==='approved'){
    if(vehicle){
      const a=vehAccess(r.loc,r.vtype);
      const warn=a.state==='blocked'?`<div class="short-note" style="border-left:3px solid var(--red);padding-left:10px">${esc(a.msg)}</div>`:'';
      actions=warn+(r.fleet
        ? `<div class="short-note">Campus fleet vehicle. Dispatch it and confirm the driver has the approach route.</div>
           <button class="btn primary" onclick="advReq('${id}','released')">Dispatch campus vehicle</button>`

           <button class="btn primary" onclick="advReq('${id}','sourcing')">Request from ${esc(r.agency||'the agency')}</button>
           <button class="btn" onclick="advReq('${id}','released')">Dispatch a campus vehicle instead</button>`);
    } else if(manpower){
      if(inStock) actions=`<div class="short-note">${avail} personnel available covers this request for ${r.qty}. Deploy them from the roster to ${esc(r.loc||'the location')}.</div>
        <button class="btn primary" onclick="advReq('${id}','released')">Fill from available personnel</button>
        <button class="btn" onclick="advReq('${id}','sourcing')">Route to Liaison (mutual aid)</button>`;
      else actions=`<div class="short-note">Only ${avail} personnel available for a request of ${r.qty}. Route to Liaison for external mutual aid, or check in more personnel via the iTALA scan first.</div>
        <button class="btn primary" onclick="advReq('${id}','sourcing')">Route to Liaison (mutual aid)</button>
        ${avail>0?`<button class="btn" onclick="advReq('${id}','released')">Fill with ${avail} available now</button>`:''}`;
    } else if(inStock) actions=`<div class="short-note">${inv.qty} ${inv.unit} on hand covers this request. Release from the storehouse.</div>
      <button class="btn primary" onclick="advReq('${id}','released')">Release from stock (Logistics)</button>`;
    else actions=`<div class="short-note">Only ${inv?inv.qty:0} on hand for a request of ${r.qty}. Route to Liaison for external sourcing.</div>
      <button class="btn primary" onclick="advReq('${id}','sourcing')">Route to Liaison (external)</button>`;
  } else if(r.status==='sourcing'&&vehicle){
    actions=`<div class="short-note">${esc(r.agency||'The agency')} has been tasked. Confirm once the unit is rolling so the ground knows what to expect.</div>
      <button class="btn primary" onclick="advReq('${id}','released')">Confirm unit dispatched</button>`;
  } else if(r.status==='sourcing'){
    actions=manpower
      ? `<div class="short-note">Liaison coordinating external mutual aid (partner agency or nearby unit).</div>
         <button class="btn primary" onclick="advReq('${id}','released')">Confirm mutual aid inbound</button>`
      : `<div class="short-note">Liaison coordinating an external source. Finance funds the purchase on arrival.</div>
         <button class="btn primary" onclick="advReq('${id}','released')">Confirm sourced and funded (Liaison + Finance)</button>`;
  } else if(r.status==='released'){
    actions=`<button class="btn primary" onclick="advReq('${id}','delivered')">${vehicle?'Confirm arrival on scene':manpower?'Confirm on scene':'Mark delivered'}</button>`;
  } else if(r.status==='delivered'){
    if(vehicle) actions=`<div class="short-note">Unit on scene at ${esc(r.loc||'the location')}.${r.patients?' Transporting '+r.patients+' patient'+(r.patients===1?'':'s')+' to '+esc(r.facility)+'.':''} Release it when the task is complete so the agency can redeploy.</div>
      <button class="btn primary" onclick="advReq('${id}','liquidated')">Release from the incident</button>`;
    else if(manpower) actions=`<div class="short-note">Personnel on scene at ${esc(r.loc||'the location')}. Close when the assignment is complete and personnel are recalled.</div>
      <button class="btn primary" onclick="advReq('${id}','liquidated')">Close request</button>`;
    else if(r.cost>0) actions=`<div class="short-note">External purchase of PHP ${r.cost.toLocaleString()} to close out.</div>
      <button class="btn primary" onclick="advReq('${id}','liquidated')">Liquidate (Finance and Admin)</button>`;
    else actions=`<div class="short-note">Released from own stock, no purchase to liquidate.</div>
      <button class="btn primary" onclick="advReq('${id}','liquidated')">Close request</button>`;
  } else if(r.status==='liquidated'){
    actions=`<div class="short-note">Request closed.${!manpower&&r.cost?' Cost liquidated: PHP '+r.cost.toLocaleString()+'.':(manpower?' Personnel recalled to available.':' Released from own stock, no cost.')}</div>`;
  } else {
    actions=`<div class="short-note">Request denied by the approver.</div>`;
  }
  const linkLine = r.link==='sipat'?'Linked to a SIPAT assistance flag.'
    : r.link==='itala'?'Linked to an iTALA injured count.':'Raised directly in KAMALIG.';
  const srcLabel = vehicle? (r.fleet?'Campus fleet':'External agency')
    : manpower? (inStock?'Own roster':'External mutual aid') : (inStock?'Own stock':'External (Liaison)');
  const availLabel = vehicle? (r.qty+' unit'+(r.qty===1?'':'s')+' requested')
    : manpower? `${avail} available` : (inv?inv.qty+' '+inv.unit:'n/a');
  const d=document.createElement('div');
  d.className='drawer'; d.onclick=e=>{if(e.target===d)d.remove();};
  d.innerHTML=`<div class="sheet">
    <h3>${r.id} · ${esc(r.item)} <span class="mono" style="color:var(--kamalig)">${vehicle?r.qty+' unit'+(r.qty===1?'':'s'):manpower?r.qty+' pax':'x'+r.qty}</span></h3>
    <div class="sub">Requested by ${esc(r.by)} · for ${esc(r.forNeed)}</div>
    <div class="stepper2">${steps}</div>
    <div class="seg"><div class="cap">Details</div>
      <div class="reqmeta">
        <div><span>Type</span><b style="text-transform:none;color:var(--kamalig)">${vehicle?'Vehicle':manpower?'Personnel and teams':'Supplies and equipment'}</b></div>
        ${vehicle?`<div><span>Source</span><b style="text-transform:none">${r.fleet?'Campus fleet':esc(r.agency||'External agency')}</b></div>`:''}
        ${vehicle&&r.patients!==null&&r.patients!==undefined&&/Ambulance/i.test(r.vtype||'')?`<div><span>Patients</span><b style="text-transform:none">${r.patients} to ${esc(r.facility||'facility not set')}</b></div>`:''}
        ${vehicle&&r.water?`<div><span>Water at scene</span><b style="text-transform:none;font-weight:500">${esc(r.water)}</b></div>`:''}
        <div><span>Deploy to</span><b style="text-transform:none;color:var(--kamalig)">${esc(r.loc||'Not set')}</b></div>
        <div><span>Priority</span><b style="color:${r.priority==='urgent'?'var(--red)':'var(--txt)'}">${r.priority}</b></div>
        <div><span>${vehicle?'Units':manpower?'Roster':'In storehouse'}</span><b style="text-transform:none">${availLabel}</b></div>
        <div><span>Source</span><b style="text-transform:none">${srcLabel}</b></div>
        <div><span>Linkage</span><b style="text-transform:none;font-weight:500">${linkLine}</b></div>
      </div>
      ${vehicle?(()=>{const a=vehAccess(r.loc,r.vtype);const c={clear:'var(--go)',restricted:'var(--amber)',blocked:'var(--red)',none:'var(--grey)'}[a.state];
        return `<div class="short-note" style="margin-top:10px;border-left:3px solid ${c};padding-left:10px"><b>Vehicle access.</b> ${esc(a.msg)}</div>`;})():''}
      ${(r.custom&&!vehicle)?`<div class="short-note" style="margin-top:10px">${manpower?'This team or skill is not on the standard list, so it is sourced through Liaison as mutual aid.':'This item is not carried in the storehouse, so it must be sourced externally through Liaison.'}</div>`:''}
      ${r.note?`<div style="margin-top:10px"><div class="cap">Notes from the requester</div><p class="modinfo-p">${esc(r.note)}</p></div>`:''}
    </div>
    <div class="seg"><div class="cap">Next action</div><div class="req-actions">${actions}</div></div>
    <div class="actions"><button class="btn" onclick="this.closest('.drawer').remove()">Close</button></div>
  </div>`;
  document.querySelector('.stage').appendChild(d);
}
function advReq(id,to){
  if(frozen('Moving a request'))return;
  const r=S.kamalig.requests.find(x=>x.id===id); if(!r)return;
  const manpower=r.kind==='manpower', vehicle=r.kind==='vehicle';
  let extra='';
  if(to==='released'){
    if(manpower && r.status==='approved'){
      const n=mpFill(r.role, r.qty, r.loc);
      extra = n>0? ' '+n+' personnel deployed.' : '';
    } else if(!manpower && !vehicle){
      const inv=S.kamalig.inventory.find(i=>i.id===r.invId);
      if(r.status==='approved' && inv && inv.qty>=r.qty){ inv.qty-=r.qty; }
      else if(r.status==='sourcing'){ r.cost=r.cost||(r.qty*90); }
    }
  }
  if(to==='liquidated' && manpower){ mpRecallForReq(r); }
  const labels=vehicle
    ? {approved:'approved',denied:'denied',released:'dispatched',sourcing:'requested from the agency',delivered:'confirmed on scene',liquidated:'released from the incident'}
    : {approved:'approved',denied:'denied',released:manpower?'filled':'released',sourcing:manpower?'routed to Liaison for mutual aid':'routed to Liaison',delivered:manpower?'confirmed on scene':'marked delivered',liquidated:manpower?'closed and personnel recalled':'liquidated'};
  r.status=to;
  const dr=document.querySelector('.drawer'); if(dr)dr.remove();
  logEvent('resource','Request '+id+' '+(labels[to]||to)+': '+r.item+'.');
  toast(`${id} ${labels[to]||to}.`+extra);
  render();
}
/* deploy available personnel to fill a manpower request, preferring role match */
function mpFill(role, n, loc){
  const key=(role||'').split(' ')[0].toLowerCase();
  const avail=S.kamalig.manpower.filter(p=>p.in && p.status==='available');
  avail.sort((a,b)=>{
    const am=(a.role+' '+a.section).toLowerCase().includes(key)?0:1;
    const bm=(b.role+' '+b.section).toLowerCase().includes(key)?0:1;
    return am-bm;
  });
  let filled=0; const pick=[];
  for(const p of avail){ if(filled>=n)break; pick.push(p); filled+=Math.max(1,p.size||1); }
  pick.forEach(p=>{ p.status='deployed'; p.assign={task:role||'Assignment', loc:loc||'Assembly area'}; });
  return filled;
}
/* recall personnel that were filling a manpower request back to available */
function mpRecallForReq(r){
  S.kamalig.manpower.forEach(p=>{
    if(p.status==='deployed' && p.assign && p.assign.task===r.role && p.assign.loc===r.loc){ p.status='available'; p.assign=null; }
  });
}

/* =========================================================
   TRIGGER  ·  incident report broadcast over the local network
   ========================================================= */
let TRIG=null;
const TRIG_RCP=['Incident Commander','Operations Section','Safety Officer','All building marshals','Logistics (KAMALIG)','Finance and Admin','Everyone on network'];
const TRIG_REACH={'Incident Commander':1,'Operations Section':6,'Safety Officer':1,'All building marshals':12,'Logistics (KAMALIG)':4,'Finance and Admin':3};
function trigReach(){
  let dev=0;
  TRIG.rcp.forEach(g=>{ dev+= g==='Everyone on network'? S.itala.present : (TRIG_REACH[g]||0); });
  const sms= TRIG.rcp.has('Everyone on network')? S.itala.registered : dev;
  return {dev,sms};
}
function trigReachNote(){
  const r=trigReach();
  let s='Estimated reach: about '+r.dev+' device'+(r.dev===1?'':'s')+' in-app on the local network';
  if(TRIG.ch.has('sms')) s+=', and about '+r.sms+' mobile number'+(r.sms===1?'':'s')+' by SMS through the field GSM gateway. Numbers come from the iTALA registry under registration consent.';
  else s+='.';
  return s;
}
function openTrigger(){
  TRIG={sev:'urgent',msg:'',loc:'Campus-wide',rcp:new Set(['Incident Commander','Operations Section']),ch:new Set(['app'])};
  renderTrigger();
}
function reopenTrigger(){ const d=document.querySelector('.drawer.trig'); if(d)d.remove(); renderTrigger(); }
function renderTrigger(){
  const locs=['Campus-wide','Assembly area',...SIPAT.buildings.map(b=>b.name)];
  const sevs=[['info','Info','var(--grey)'],['urgent','Urgent','var(--orange)'],['emergency','Emergency','var(--red)']];
  const d=document.createElement('div');
  d.className='drawer trig'; d.onclick=e=>{if(e.target===d){d.remove();TRIG=null;}};
  d.innerHTML=`<div class="sheet">
    <h3>Trigger an incident report</h3>
    <div class="sub">Broadcasts over the local field network. Only the groups you pick receive the notification.</div>
    <div class="seg"><div class="cap">Severity</div><div class="choices">${sevs.map(([k,l,c])=>
      `<button class="choice ${TRIG.sev===k?'on':''}" style="--cc:${c}" onclick="TRIG.sev='${k}';reopenTrigger()"><span class="k"></span>${l}</button>`).join('')}</div></div>
    <div class="field"><label>What happened</label>
      <input id="trMsg" value="${esc(TRIG.msg)}" placeholder="e.g. Smoke on 2nd floor, east wing" oninput="TRIG.msg=this.value"></div>
    <div class="field"><label>Location</label>
      <select onchange="TRIG.loc=this.value">${locs.map(l=>`<option ${l===TRIG.loc?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
    <div class="seg"><div class="cap">Notify who</div><div class="togs">${TRIG_RCP.map(r=>
      `<button class="tog ${TRIG.rcp.has(r)?'on':''}" onclick="trigRcp('${r.replace(/'/g,"\\'")}')">${r}</button>`).join('')}</div></div>
    <div class="seg"><div class="cap">Send as</div><div class="togs">
      <button class="tog ${TRIG.ch.has('app')?'on':''}" onclick="trigCh('app')">In-app · local network</button>
      <button class="tog ${TRIG.ch.has('sms')?'on':''}" onclick="trigCh('sms')">SMS text blast</button>
    </div><div class="short-note" style="margin-top:8px">${trigReachNote()}</div></div>
    <div class="actions">
      <button class="btn" onclick="this.closest('.drawer').remove();TRIG=null">Cancel</button>
      <button class="btn primary" onclick="sendTrigger()">Send alert</button>
    </div>
  </div>`;
  document.querySelector('.stage').appendChild(d);
}
function trigRcp(name){
  if(!TRIG)return;
  if(TRIG.rcp.has(name))TRIG.rcp.delete(name); else TRIG.rcp.add(name);
  reopenTrigger();
}
function trigCh(k){
  if(!TRIG)return;
  if(TRIG.ch.has(k))TRIG.ch.delete(k); else TRIG.ch.add(k);
  reopenTrigger();
}
function sendTrigger(){
  if(frozen('Sending an alert'))return;
  if(!TRIG)return;
  const rcp=[...TRIG.rcp];
  if(!rcp.length){toast('Pick at least one recipient group.');return;}
  const ch=[...TRIG.ch];
  if(!ch.length){toast('Pick at least one channel.');return;}
  const msg=(TRIG.msg||'').trim()||'Incident reported';
  S.alerts.unshift({t:Date.now(),sev:TRIG.sev,msg,loc:TRIG.loc,rcp,ch});
  logEvent('alert','Alert ('+TRIG.sev+'): '+msg+' to '+rcp.join(', ')+' via '+ch.map(x=>x==='app'?'in-app':'SMS').join(' + ')+'.');
  const d=document.querySelector('.drawer.trig'); if(d)d.remove();
  const chLbl=ch.map(c=>c==='app'?'in-app':'SMS').join(' + ');
  TRIG=null;
  toast('Alert sent to '+rcp.length+' recipient group'+(rcp.length===1?'':'s')+' via '+chLbl+'.');
  render();
}
function alertFeed(){
  if(!S.alerts.length)return '';
  const sev={info:['Info','var(--grey)'],urgent:['Urgent','var(--orange)'],emergency:['Emergency','var(--red)']};
  return `<div class="card" style="margin-top:16px;padding:16px 18px">
    <div class="eyebrow" style="margin-bottom:6px">Recent alerts · local network</div>
    ${S.alerts.slice(0,3).map(a=>{
      const [l,c]=sev[a.sev]||sev.info; const dt=new Date(a.t);
      const hm=String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
      return `<div class="alertrow"><span class="pill" style="background:color-mix(in srgb,${c} 18%,var(--ink));color:${c}">${l}</span>
        <div><b>${esc(a.msg)}</b> · ${esc(a.loc)}<div class="sub2">to ${a.rcp.map(esc).join(', ')} · via ${(a.ch||['app']).map(x=>x==='app'?'in-app':'SMS').join(' + ')} · ${hm}</div></div></div>`;}).join('')}
  </div>`;
}

/* =========================================================
   FIELD NETWORK  ·  closed local network status (no internet)
   ========================================================= */
function netPaint(){
  const chip=document.getElementById('opNet'); if(!chip)return;
  chip.classList.toggle('off',!S.net.online);
  document.getElementById('opNetLbl').textContent=S.net.online?'Field server':'Device-only';
}
function openNet(){
  const n=S.net;
  const rows=[
    ['Local domain', n.server],
    ['Server IP', n.ip],
    ['Network (SSID)', n.ssid],
    ['Internet', 'None. Closed field network.'],
    ['Connected devices', n.online? String(n.devices) : 'This device only'],
    ['SMS gateway', n.online? (n.sms==='ready'?'Ready (GSM modem on field server)':n.sms) : 'Unavailable while device-only'],
    ['Sync state', n.online? 'Live over local WebSocket' : (n.queued+' change'+(n.queued===1?'':'s')+' queued on this device')],
  ].map(([k,v])=>`<div><span>${k}</span><b style="text-transform:none;font-weight:600">${esc(v)}</b></div>`).join('');
  const d=document.createElement('div');
  d.className='drawer netd'; d.onclick=e=>{if(e.target===d)d.remove();};
  d.innerHTML=`<div class="sheet">
    <h3>Field network</h3>
    <div class="sub">The suite is served from the field server on the closed network. Every device browses to ${esc(n.server)} with zero internet.</div>
    <div class="seg"><div class="cap">Status</div><div class="reqmeta">${rows}</div></div>
    <div class="short-note" style="margin-bottom:14px">${S.net.online
      ? 'Live sync is on. Room reports, requests, triggers, and beacon commands move over the local network in real time.'
      : 'You are off the field network. Everything keeps working from local storage on this device, and your changes will sync automatically the moment you rejoin.'}</div>
    <div class="short-note" style="margin-bottom:14px">Data is saved locally on this device and persists across reloads. <button onclick="if(confirm('Reset all demo data on this device?'))resetData()" style="background:none;border:none;color:var(--red);font:inherit;cursor:pointer;text-decoration:underline;padding:0">Reset app data</button></div>
    <div class="actions">
      <button class="btn" onclick="this.closest('.drawer').remove()">Close</button>
      <button class="btn primary" onclick="netToggle()">${S.net.online?'Simulate disconnect':'Rejoin network'}</button>
    </div>
  </div>`;
  document.querySelector('.stage').appendChild(d);
}
function netToggle(){
  const d=document.querySelector('.drawer.netd'); if(d)d.remove();
  if(S.net.online){
    S.net.online=false; S.net.queued=0;
    logEvent('network','Went device-only (off the field network).');
    toast('Off the field network. Working device-only; changes will queue.');
  } else {
    S.net.online=true;
    const q=S.net.queued;
    logEvent('network','Rejoined the field network'+(q>0?', '+q+' queued change'+(q===1?'':'s')+' synced':'')+'.');
    toast(q>0? 'Rejoined the field network. '+q+' queued change'+(q===1?'':'s')+' synced.' : 'Rejoined the field network. Live sync restored.');
    S.net.queued=0;
  }
  netPaint(); render();
}

/* =========================================================
   SAR BEACON  ·  loud beep + pulse so rescuers can find the phone
   ========================================================= */
let BEACON={on:false,timer:null,ctx:null,silent:false,remoteBy:null};
function beaconBeep(){
  if(BEACON.silent||BEACON.mode==='covert')return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      if(!BEACON.ctx)BEACON.ctx=new AC();
      const c=BEACON.ctx, now=c.currentTime;
      for(let i=0;i<3;i++){
        const o=c.createOscillator(),g=c.createGain();
        o.type='square'; o.frequency.value=2300;
        g.gain.setValueAtTime(.0001,now+i*.26);
        g.gain.exponentialRampToValueAtTime(.5,now+i*.26+.02);
        g.gain.exponentialRampToValueAtTime(.0001,now+i*.26+.2);
        o.connect(g); g.connect(c.destination);
        o.start(now+i*.26); o.stop(now+i*.26+.22);
      }
    }
  }catch(e){}
  try{ if(navigator.vibrate)navigator.vibrate([180,90,180,90,180]); }catch(e){}
}
function beaconPaint(){
  const ov=document.getElementById('beaconOv'); if(!ov)return;
  const silent=BEACON.silent;
  ov.classList.toggle('silent',silent);
  const audioOk=!!(window.AudioContext||window.webkitAudioContext);
  const remoteLine=BEACON.remoteBy?`<br><br>Activated remotely by the ${esc(BEACON.remoteBy)} over the field network.`:'';
  const body=silent
    ? 'Silent locating is on. This phone is pulsing but making no sound, so you can stay hidden. Your position still shows to Search and Rescue on the network.'
    : 'This phone is sounding a loud repeating beep and pulsing bright so Search and Rescue can find it. Keep it exposed and near you if it is safe to do so.';
  const audioNote=(!silent&&!audioOk)?'<br><br>(Audio is unavailable in this preview, so the visual pulse stands in for the beep.)':'';
  ov.querySelector('.beacon-box').innerHTML=`
    <div class="b-rings"><span></span><span></span><span></span><div class="core"></div></div>
    <h2>${silent?'SILENT BEACON':'SAR BEACON ACTIVE'}</h2>
    <p>${body}${remoteLine}${audioNote}</p>
    <div class="b-actions">
      <button class="b-toggle" onclick="beaconToggleSilent()">${silent?'Turn on sound':'Silence'}</button>
      <button class="b-stop" onclick="stopBeacon()">Stop beacon</button>
    </div>`;
}
function startBeacon(remoteBy,mode){
  if(BEACON.on)return;
  mode=(typeof mode==='boolean')?(mode?'silent':'overt'):(mode||'overt');
  BEACON.on=true; BEACON.mode=mode; BEACON.silent=(mode!=='overt');
  BEACON.remoteBy=(typeof remoteBy==='string'&&remoteBy)?remoteBy:null;
  const self=S.rescue&&S.rescue.devices.find(d=>d.self); if(self){self.beacon='active';self.bmode=mode;self.silent=BEACON.silent;}
  logEvent('rescue','SAR beacon activated ('+mode+')'+(BEACON.remoteBy?' remotely by '+BEACON.remoteBy:'')+'.');
  /* Covert means the person holding the device is shown nothing at all.
     No overlay is created and no sound is played. */
  if(mode==='covert'){ covertDemoNote(); return; }
  const d=document.createElement('div');
  d.className='beacon-ov'; d.id='beaconOv';
  d.innerHTML=`<div class="beacon-box"></div>`;
  document.body.appendChild(d);
  beaconPaint();
  beaconBeep();
  BEACON.timer=setInterval(beaconBeep,1600);
}
/* A covert beacon is invisible by design, which cannot be demonstrated by
   showing nothing, so the demo explains what the subject would not see. */
function covertDemoNote(){
  drawer(`<h3>Covert beacon running</h3>
    <div class="sub">Nothing appears on the subject device</div>
    <div class="seg"><div class="cap">What the person holding the phone sees</div>
      <p class="modinfo-p">Nothing. No sound, no screen, no notification. The phone looks exactly as it did a moment ago. This panel exists only because a demonstration cannot show you an absence.</p></div>
    <div class="seg"><div class="cap">What the command side sees</div>
      <p class="modinfo-p">The device is listed as covertly active on the rescue board and keeps reporting its position over the field network, so a search team can be directed to it without anyone nearby being alerted.</p></div>
    <div class="short-note">Location only. The microphone and camera are untouched.</div>
    <div class="actions"><button class="btn" onclick="this.closest('.drawer').remove()">Close</button>
      <button class="btn primary" onclick="this.closest('.drawer').remove();stopBeacon()">Stop covert beacon</button></div>`);
}
function beaconToggleSilent(){
  BEACON.silent=!BEACON.silent;
  BEACON.mode=BEACON.silent?'silent':'overt';
  const self=S.rescue&&S.rescue.devices.find(d=>d.self); if(self){self.silent=BEACON.silent;self.bmode=BEACON.mode;}
  beaconPaint();
  toast(BEACON.silent?'Beacon silenced. Still locating on the network.':'Beacon sound on.');
}
function stopBeacon(){
  BEACON.on=false; BEACON.silent=false; BEACON.mode='overt'; BEACON.remoteBy=null;
  if(BEACON.timer){clearInterval(BEACON.timer);BEACON.timer=null;}
  if(BEACON.ctx){try{BEACON.ctx.close();}catch(e){} BEACON.ctx=null;}
  const self=S.rescue&&S.rescue.devices.find(d=>d.self);
  if(self&&self.beacon!=='off'){ self.beacon='off'; self.silent=false; self.bmode=null; if(typeof rescueLogAdd==='function')rescueLogAdd('Beacon on this device stopped.'); }
  const o=document.getElementById('beaconOv'); if(o)o.remove();
  toast('Beacon stopped.');
  render();
}

/* =========================================================
   POST-RENDER + BOOT
   ========================================================= */
function postRender(){
  if(S.screen==='sipat' && SIPAT.view==='map' && SIPAT.map.mode==='live' && !sipatCtx().b){ mountSipatMap(); }
  if(S.screen==='itala:register') renderIdQR();
}

/* =========================================================
   PERSISTENCE  ·  local, offline. window.storage (in-app) or
   localStorage (downloaded file), with in-memory fallback.
   ========================================================= */
const DB={ key:'rcdmts_state_v3', mem:null };
async function dbSet(v){
  try{ if(typeof window!=='undefined' && window.storage && window.storage.set){ await window.storage.set(DB.key,v,false); return; } }catch(e){}
  try{ localStorage.setItem(DB.key,v); return; }catch(e){}
  DB.mem=v;
}
async function dbGet(){
  try{ if(typeof window!=='undefined' && window.storage && window.storage.get){ const r=await window.storage.get(DB.key); return (r&&r.value)||null; } }catch(e){}
  try{ const v=localStorage.getItem(DB.key); if(v!=null) return v; }catch(e){}
  return DB.mem;
}
async function dbClear(){
  try{ if(window.storage&&window.storage.delete) await window.storage.delete(DB.key,false); }catch(e){}
  try{ localStorage.removeItem(DB.key); }catch(e){}
  DB.mem=null;
}
function serialize(){
  return JSON.stringify({ v:3,
    mode:S.mode, modeLocked:S.modeLocked, incident:S.incident, net:S.net,
    alerts:S.alerts, log:S.log, history:S.history, itala:S.itala, kamalig:S.kamalig,
    rescue:{devices:S.rescue.devices, log:S.rescue.log, actingAs:S.rescue.actingAs},
    sipat:{ buildings:SIPAT.buildings,
      map:{center:SIPAT.map.center,zoom:SIPAT.map.zoom,basemap:SIPAT.map.basemap,mode:SIPAT.map.mode,snap:SIPAT.map.snap,snapBounds:SIPAT.map.snapBounds} }
  });
}
function hydrate(o){
  if(!o||o.v!==3)return false;
  try{
    if(o.mode)S.mode=o.mode;
    if(typeof o.modeLocked==='boolean')S.modeLocked=o.modeLocked;
    if(o.incident)S.incident=o.incident;
    if(o.net)S.net=o.net;
    if(Array.isArray(o.alerts))S.alerts=o.alerts;
    if(Array.isArray(o.log))S.log=o.log;
    if(Array.isArray(o.history))S.history=o.history;
    if(o.itala)S.itala=o.itala;
    if(o.kamalig)S.kamalig=o.kamalig;
    if(o.rescue){ if(Array.isArray(o.rescue.devices))S.rescue.devices=o.rescue.devices; if(Array.isArray(o.rescue.log))S.rescue.log=o.rescue.log; }
    if(o.sipat){ if(Array.isArray(o.sipat.buildings))SIPAT.buildings=o.sipat.buildings; if(o.sipat.map)Object.assign(SIPAT.map,o.sipat.map); }
    return true;
  }catch(e){ return false; }
}
let _persistT=null, _persistReady=false;
function persist(){ if(!_persistReady)return; clearTimeout(_persistT); _persistT=setTimeout(()=>{ dbSet(serialize()); },400); }
async function resetData(){
  await dbClear();
  location.reload();
}

/* =========================================================
   REAL QR  ·  opaque token, no personal data on the card.
   Falls back to the decorative pattern if the library is absent.
   ========================================================= */
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h.toString(36); }
function idToken(){ const d=S.itala&&S.itala.draft||{}; const seed=(d.n||'')+'|'+(d.r||''); return seed.trim()?hashStr(seed):'demo'; }
function renderIdQR(){
  const el=document.getElementById('idQR'); if(!el)return;
  if(typeof QRCode==='undefined')return; // keep decorative fallback offline / in tests
  try{ el.innerHTML=''; new QRCode(el,{text:'RCDMTS|ID|'+idToken(), width:58, height:58, colorDark:'#0c1b2e', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
}

// seal watermark: build rays + stars once
(function buildSeal(){
  const rays=$('#rays'), stars=$('#stars'); if(!rays)return;
  let rr='';
  for(let i=0;i<24;i++){const a=(i/24)*Math.PI*2;
    const x1=50+Math.cos(a)*31, y1=50+Math.sin(a)*31;
    const x2=50+Math.cos(a)*38, y2=50+Math.sin(a)*38;
    rr+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="currentColor" stroke-width="2.2"/>`;
  }
  rays.innerHTML=rr;
  const star=(cx,cy,r)=>{let p='';for(let k=0;k<5;k++){
    const a=-Math.PI/2+k*2*Math.PI/5, a2=a+Math.PI/5;
    p+=`${(cx+Math.cos(a)*r).toFixed(1)},${(cy+Math.sin(a)*r).toFixed(1)} ${(cx+Math.cos(a2)*r*0.42).toFixed(1)},${(cy+Math.sin(a2)*r*0.42).toFixed(1)} `;}
    return `<polygon points="${p}" fill="currentColor"/>`;};
  stars.innerHTML=star(50,20.5,4)+star(28.5,66,4)+star(71.5,66,4);
})();

/* BOOT */
(async function boot(){
  let restored=false;
  try{ const raw=await dbGet(); if(raw){ restored=hydrate(JSON.parse(raw)); } }catch(e){}
  _persistReady=true;
  if(restored){ applyMode(S.mode||'drill'); } else { setMode('drill'); }
  netPaint();
  go('about');
  tick(); setInterval(tick,1000);
})();
</script>
