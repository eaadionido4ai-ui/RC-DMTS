<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resilient Campus Disaster Management Tool Suite · iTALA · SIPAT · GAB.ai · KAMALIG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --ink:#0c1b2e; --ink-2:#12263c; --ink-3:#1b3350; --ink-4:#26476b;
  --paper:#eef2f7; --paper-2:#f8fafc; --paper-line:#d7dfe9;
  --txt:#e8eef6; --txt-dim:#9db0c6; --txt-ink:#152438; --txt-ink-dim:#5c6f86;
  --line:rgba(255,255,255,.10);
  /* ISO safety status system (meaning, not decoration) */
  --go:#20a15a; --amber:#f4a723; --orange:#e8642c; --red:#d8423b; --grey:#7d8b9c;
  /* tool accents */
  --itala:#3a7fc4; --sipat:#1fa79a; --gab:#ffb44a; --kamalig:#8b6ff0;
  --mode:var(--amber);            /* shifts amber->red on actual */
  --mode-soft:rgba(244,167,35,.16);
  --radius:14px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); background:var(--ink); color:var(--txt);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:var(--mono)}
.hidden{display:none !important}

/* ============ APP FRAME ============ */
#app{display:flex;flex-direction:column;height:100vh}

/* ---- Operation Strip (signature) ---- */
.opstrip{
  display:flex;align-items:stretch;gap:0;background:var(--ink);
  border-bottom:1px solid var(--line);position:relative;z-index:40;
  box-shadow:0 2px 0 rgba(0,0,0,.25);
}
.op-hazard{width:12px;flex:none;
  background:repeating-linear-gradient(135deg,var(--mode) 0 10px,#0c1b2e 10px 20px);
  transition:background .4s;
}
.op-body{flex:1;display:flex;align-items:center;gap:20px;padding:10px 16px;min-width:0}
.op-mode{display:flex;align-items:center;gap:9px;flex:none}
.op-mode .dot{width:10px;height:10px;border-radius:50%;background:var(--mode);
  box-shadow:0 0 0 4px var(--mode-soft);transition:.4s}
.op-mode .lab{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--mode);transition:.4s}
.op-inc{flex:none;min-width:0;cursor:pointer;border-radius:8px;padding:2px 7px;margin:-2px -7px;transition:.15s}
.op-inc:hover{background:var(--ink-2)}
.op-haz{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-right:8px;vertical-align:middle;
  background:var(--mode-soft);color:var(--mode);transition:.4s}
.op-inc .t{font-size:11px;color:var(--txt-dim);letter-spacing:.04em}
.op-inc .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.op-clock{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.04em;flex:none;
  font-variant-numeric:tabular-nums}
.op-toggle{flex:none;display:flex;background:var(--ink-2);border-radius:9px;padding:3px;margin-left:6px;border:1px solid var(--line)}
.op-toggle button{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;
  padding:6px 12px;border-radius:6px;color:var(--txt-dim)}
.op-toggle button.on[data-m="drill"]{background:var(--amber);color:#3a2b00}
.op-toggle button.on[data-m="actual"]{background:var(--red);color:#fff}
.op-toggle.locked button{cursor:default}
.op-toggle.locked button:not(.on){opacity:.35}
.op-lock{display:grid;place-items:center;padding:0 6px 0 4px;color:var(--txt-dim)}
.op-lock svg{width:12px;height:12px}
@media(max-width:820px){.op-inc .n{max-width:34vw}}
@media(max-width:600px){.op-clock{font-size:16px}.op-inc .n{max-width:30vw}.op-inc .t{display:none}}

/* ---- Main split: rail + stage ---- */
.frame{flex:1;display:flex;min-height:0}
.rail{width:82px;flex:none;background:var(--ink);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;z-index:30}
.rail .brand{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--ink-3),var(--ink-2));border:1px solid var(--line);
  font-family:var(--serif);font-size:22px;color:#fff;margin-bottom:10px}
.rail .nav{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.rail .nav button{width:62px;padding:9px 0 7px;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;gap:5px;color:var(--txt-dim);transition:.15s;border:1px solid transparent}
.rail .nav button .ico{width:24px;height:24px}
.rail .nav button .lb{font-size:9.5px;font-weight:600;letter-spacing:.02em}
.rail .nav button:hover{background:var(--ink-2);color:var(--txt)}
.rail .nav button.on{background:var(--ink-2);color:#fff;border-color:var(--line)}
.rail .nav button.on[data-tool="itala"]{box-shadow:inset 3px 0 0 var(--itala)}
.rail .nav button.on[data-tool="sipat"]{box-shadow:inset 3px 0 0 var(--sipat)}
.rail .nav button.on[data-tool="gab"]{box-shadow:inset 3px 0 0 var(--gab)}
.rail .nav button.on[data-tool="kamalig"]{box-shadow:inset 3px 0 0 var(--kamalig)}
.rail .nav button.on[data-tool="home"]{box-shadow:inset 3px 0 0 #fff}
.rail .spacer{flex:1}
.rail .about{width:44px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--txt-dim)}
.rail .about:hover{background:var(--ink-2);color:var(--txt)}

.stage{flex:1;min-width:0;position:relative;overflow:hidden;background:
  radial-gradient(1200px 500px at 80% -10%,rgba(46,84,120,.35),transparent),var(--ink)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:26px 28px 90px}
@media(max-width:600px){.wrap{padding:18px 16px 90px}.rail{width:64px}.rail .nav button{width:54px}}

/* ---- UP seal silhouette watermark (bottom-left, ~75% shown) ---- */
.seal-wm{position:absolute;left:-88px;bottom:-96px;width:380px;height:380px;
  opacity:.055;pointer-events:none;z-index:0;color:#cfe0f5;user-select:none}
@media(max-width:600px){.seal-wm{width:270px;height:270px;left:-70px;bottom:-78px}}

/* ============ SHARED UI ATOMS ============ */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--txt-dim)}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.06em;padding:4px 9px;border-radius:999px;text-transform:uppercase}
.dotc{width:9px;height:9px;border-radius:50%;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:11px;font-weight:600;
  font-size:14px;background:var(--ink-3);border:1px solid var(--line);color:var(--txt);transition:.15s}
.btn:hover{background:var(--ink-4)}
.btn.primary{background:var(--mode);color:#22190a;border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
body.actual .btn.primary{color:#fff}

/* status colors as utility */
.s-unsearched{--sc:var(--grey)} .s-searching{--sc:var(--amber)} .s-cleared{--sc:var(--go)}
.st-safe{--tc:var(--go)} .st-restricted{--tc:var(--orange)} .st-unsafe{--tc:var(--red)}

/* ============ ABOUT / HOME ============ */
.hero{position:relative;z-index:1;padding:12px 0 8px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,6vw,68px);line-height:.98;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--gab)}
.hero .sub{max-width:640px;margin-top:16px;color:var(--txt-dim);font-size:16px;line-height:1.6}
.suite-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.suite-strip .tg{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  background:var(--ink-2);border:1px solid var(--line);font-size:13px;font-weight:600}
.suite-strip .tg .k{width:9px;height:9px;border-radius:50%}
.about-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-top:30px}
@media(max-width:820px){.about-grid{grid-template-columns:1fr}}
.about-grid .card{padding:22px 24px}
.about-grid h3{font-size:13px;letter-spacing:.02em;margin-bottom:12px;color:var(--txt)}
.abstract p{color:var(--txt-dim);line-height:1.72;font-size:15px;margin-bottom:12px}
.credit{display:flex;flex-direction:column;gap:14px}
.credit .row{display:flex;flex-direction:column;gap:2px}
.credit .row .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)}
.credit .row .v{font-size:15px;font-weight:600}
.learn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media(max-width:600px){.learn{grid-template-columns:1fr}}
.learn .doc{padding:18px 20px}
.learn .doc h4{font-size:14px;margin-bottom:6px}
.learn .doc p{font-size:13px;color:var(--txt-dim);line-height:1.5;margin-bottom:12px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);
  border:1px dashed rgba(244,167,35,.4);padding:3px 8px;border-radius:6px}
.enter-row{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ============ INCIDENT ACTIVATION ============ */
.act-wrap{max-width:720px;margin:0 auto;padding-top:6px}
.act-h{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1;margin:6px 0 10px}
.act-sub{color:var(--txt-dim);font-size:15px;line-height:1.6;max-width:560px;margin-bottom:24px}
.act-modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.act-modes{grid-template-columns:1fr}}
.act-mode{text-align:left;padding:16px 18px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--ink-2);display:flex;flex-direction:column;gap:3px;transition:.15s;position:relative;color:var(--txt)}
.act-mode:hover{border-color:var(--mc)}
.act-mode.on{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 14%,var(--ink-2))}
.act-mode .am-dot{width:14px;height:14px;border-radius:50%;background:var(--mc);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--mc) 25%,transparent);margin-bottom:8px}
.act-mode .am-l{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.1em;color:var(--mc)}
.act-mode .am-d{font-size:12.5px;color:var(--txt-dim)}
.act-mode.on::after{content:"SELECTED";position:absolute;top:15px;right:15px;font-family:var(--mono);
  font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--mc)}
.act-stamp{font-size:11.5px;color:var(--txt-dim);margin:18px 0 20px;letter-spacing:.03em;
  display:flex;align-items:center;gap:8px}
.act-stamp::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mode);flex:none}
.act-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.act-go{padding:13px 24px;font-size:15px}

/* ============ SUITE HOME (launcher) ============ */
.launch-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.launch-head h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1}
.launch-head p{color:var(--txt-dim);font-size:14px;margin-top:6px;max-width:520px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:16px}
@media(max-width:560px){.tools{grid-template-columns:1fr}}
.tool{padding:0;overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column;position:relative}
.tool:hover{transform:translateY(-3px);border-color:var(--ta)}
.modinfo{position:absolute;top:13px;right:13px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  background:var(--ink-3);border:1px solid var(--line);color:var(--txt-dim);font-family:Georgia,"Times New Roman",serif;
  font-style:italic;font-weight:700;font-size:13px;line-height:1;z-index:4;padding:0;transition:.13s}
.modinfo:hover{color:var(--txt);background:var(--ink-2);border-color:color-mix(in srgb,var(--ta) 60%,var(--line))}
.modinfo-p{font-size:13.5px;line-height:1.65;color:var(--txt);margin:0}
.tool .head{padding:18px 44px 14px 20px;border-bottom:1px solid var(--line);position:relative}
.tool .head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ta)}
.tool .head .nm{font-family:var(--serif);font-size:26px;line-height:1}
.tool .head .nm small{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ta);
  display:block;letter-spacing:.02em;margin-top:3px}
.tool .head .role{font-size:12.5px;color:var(--txt-dim);margin-top:8px;line-height:1.5}
.tool .body{padding:16px 20px;flex:1;display:flex;flex-direction:column;gap:10px}
.tool .metric{display:flex;align-items:baseline;gap:8px}
.tool .metric b{font-family:var(--mono);font-size:26px;font-weight:700}
.tool .metric span{font-size:12px;color:var(--txt-dim)}
.tool .mini{display:flex;gap:5px;flex-wrap:wrap}
.tool .foot{padding:12px 20px;border-top:1px solid var(--line);font-family:var(--mono);
  font-size:11px;letter-spacing:.04em;color:var(--ta);display:flex;justify-content:space-between;align-items:center}
.flow-note{margin-top:18px;padding:14px 18px;border-radius:12px;background:var(--mode-soft);
  border:1px solid var(--line);font-size:13.5px;line-height:1.6;color:var(--txt)}
.flow-note b{color:var(--mode)}

/* ============ MODULE HEADER ============ */
.mhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.mhead .badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-family:var(--serif);font-size:24px;color:#fff;flex:none}
.mhead .tt h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1}
.mhead .tt p{font-size:12.5px;color:var(--txt-dim);margin-top:2px}
.mhead .tabs{margin-left:auto;display:flex;gap:4px;background:var(--ink-2);border:1px solid var(--line);
  border-radius:11px;padding:4px;flex-wrap:wrap}
.mhead .tabs button{font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;color:var(--txt-dim)}
.mhead .tabs button.on{background:var(--ink-4);color:#fff}
.op-end{display:inline-flex;align-items:center;gap:6px;flex:none;padding:7px 11px;border-radius:9px;
  background:var(--ink-2);border:1px solid var(--line);color:var(--txt-dim);font-size:12px;font-weight:600;transition:.15s}
.op-end svg{width:13px;height:13px}
.op-end:hover{color:var(--txt);border-color:var(--txt-dim)}
.opstrip.closed .op-end{background:rgba(125,139,156,.2);color:var(--txt);border-color:var(--grey)}
.opstrip.closed .op-hazard{background:var(--grey) !important;animation:none !important}
.closedbar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--ink-2);border:1px solid var(--line);border-left:4px solid var(--grey);
  border-radius:12px;padding:14px 16px;margin-bottom:18px}
.closedbar .cb-t{font-size:14px;font-weight:700;letter-spacing:.01em}
.closedbar .cb-s{font-size:12.5px;color:var(--txt-dim);margin-top:3px;line-height:1.5}
.closedbar .cb-b{display:flex;gap:8px;flex:none}
.colist{display:flex;flex-direction:column;gap:2px}
.corow{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.corow:first-child{border-top:none}
.corow .codot{width:9px;height:9px;border-radius:50%;margin-top:5px}
.corow .cotxt{font-size:12.5px;line-height:1.5}
.corow .cotxt b{font-size:13px;margin-right:6px}
.corow .cotxt span{display:block;color:var(--txt-dim);margin-top:2px}
.corow .coval{font-size:18px;font-weight:700}
.ackrow{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.5;
  color:var(--txt-dim);margin-top:10px;cursor:pointer}
.ackrow input{margin-top:2px;flex:none;width:15px;height:15px;accent-color:var(--itala)}
.suitetabs{display:flex;gap:4px;background:var(--ink-2);border:1px solid var(--line);
  border-radius:11px;padding:4px;margin-bottom:18px;flex-wrap:wrap}
.suitetabs button{font-size:13px;font-weight:600;padding:9px 15px;border-radius:8px;color:var(--txt-dim);flex:1;min-width:92px;transition:.13s}
.suitetabs button:hover{color:var(--txt)}
.suitetabs button.on{background:var(--ink-4);color:#fff}

/* ============ iTALA MODULE ============ */
.panel{padding:22px 24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--txt-dim);margin-bottom:6px}
.field textarea{width:100%;min-height:74px;resize:vertical;font-family:var(--sans);line-height:1.5}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:10px;background:var(--ink);
  border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:14px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--itala);outline-offset:1px}
.idcard{background:linear-gradient(155deg,var(--ink-3),var(--ink-2));border:1px solid var(--line);
  border-radius:14px;padding:18px;position:relative;overflow:hidden}
.idcard::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,var(--itala),transparent 70%);opacity:.35}
.idcard .lab{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--txt-dim)}
.idcard .nm{font-size:22px;font-weight:700;margin:6px 0 2px}
.idcard .meta{font-size:13px;color:var(--txt-dim)}
.idcard .qr{margin-top:14px;display:flex;align-items:center;gap:12px}
.idcard .qr .code{width:64px;height:64px;border-radius:8px;background:
  conic-gradient(#fff 0 25%,#0c1b2e 0 50%,#fff 0 75%,#0c1b2e 0);
  background-size:16px 16px;flex:none;border:3px solid #fff}
.idcard .qr .txt{font-family:var(--mono);font-size:11px;color:var(--txt-dim);line-height:1.5}
.roster{margin-top:16px}
.rrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;background:var(--ink);
  border:1px solid var(--line);margin-bottom:8px}
.rrow .av{width:34px;height:34px;border-radius:9px;background:var(--ink-3);display:grid;place-items:center;
  font-weight:700;font-size:13px;flex:none}
.rrow .info{flex:1;min-width:0}
.rrow .info .n{font-weight:600;font-size:14px}
.rrow .info .m{font-size:12px;color:var(--txt-dim)}
.scanbox{text-align:center;padding:34px 20px}
.scanframe{width:180px;height:180px;margin:0 auto 18px;border-radius:18px;position:relative;--fc:var(--go);
  background:var(--ink);border:2px dashed color-mix(in srgb,var(--fc) 55%,var(--line));display:grid;place-items:center;overflow:hidden}
.scanframe .line{position:absolute;left:8%;right:8%;height:2px;background:var(--fc);box-shadow:0 0 12px var(--fc);
  animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{top:14%}50%{top:84%}}
.scanframe .qr{width:96px;height:96px;border-radius:8px;background:
  conic-gradient(#e8eef6 0 25%,#12263c 0 50%,#e8eef6 0 75%,#12263c 0);background-size:24px 24px;opacity:.5}
.flash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(32,161,90,.96);
  animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.flash .big{font-family:var(--serif);font-size:56px;color:#fff}
.flash .who{font-size:20px;color:#eafff2;margin-top:6px}
.board-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bcard{padding:16px 18px}
.bcard .v{font-family:var(--mono);font-size:32px;font-weight:700;line-height:1}
.bcard .l{font-size:12px;color:var(--txt-dim);margin-top:4px}
.sitrep{font-family:var(--mono);font-size:12.5px;line-height:1.85;white-space:pre-wrap;
  background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px 20px;color:var(--txt-dim)}
.sitrep b{color:var(--txt)}

/* ============ SIPAT MODULE ============ */
.sipat-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.viewtoggle{display:flex;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.viewtoggle button{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em;
  padding:7px 14px;border-radius:7px;color:var(--txt-dim)}
.viewtoggle button.on{background:var(--sipat);color:#03211e}
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--txt-dim);flex-wrap:wrap}
.crumb button{color:var(--sipat);font-weight:600}
.crumb button:hover{text-decoration:underline}
.crumb .sep{opacity:.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;font-size:11px;color:var(--txt-dim)}
.legend .li{display:flex;align-items:center;gap:5px}

/* map view */
.campusmap{position:relative;background:
  linear-gradient(var(--ink-2),var(--ink-2)) padding-box,
  repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.04) 39px 40px),
  repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.04) 39px 40px),var(--ink);
  border:1px solid var(--line);border-radius:14px;height:420px;overflow:hidden}
.campusmap .road{position:absolute;background:rgba(255,255,255,.05)}
.bpin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:.15s}
.bpin:hover{z-index:5}
.bpin .dot{width:var(--sz,58px);height:var(--sz,58px);border-radius:13px;display:grid;place-items:center;
  border:2px solid rgba(255,255,255,.25);font-family:var(--mono);font-weight:700;font-size:13px;color:#fff;
  background:var(--sc);position:relative;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.bpin:hover .dot{transform:scale(1.08)}
.bpin .lbl{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:11px;font-weight:600;background:var(--ink);padding:2px 7px;border-radius:6px;border:1px solid var(--line)}
.bpin .flag{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;font-size:11px;border:2px solid var(--ink)}
.bpin .struct{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:22px;height:6px;
  border-radius:3px;background:var(--tc);border:1px solid rgba(0,0,0,.3)}

/* schematic + floor + room grids */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.bcell{padding:0;overflow:hidden;cursor:pointer;transition:.15s}
.bcell:hover{transform:translateY(-2px);border-color:var(--sc)}
.bcell .top{padding:14px 16px 12px;border-left:5px solid var(--sc)}
.bcell .top .n{font-weight:700;font-size:16px}
.bcell .top .a{font-size:12px;color:var(--txt-dim);margin-top:2px}
.bcell .rows{display:flex;gap:6px;padding:0 16px 12px;flex-wrap:wrap}
.bcell .bot{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
  font-size:11.5px;color:var(--txt-dim);align-items:center}
.floorgrid{display:flex;flex-direction:column;gap:10px}
.floor{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:.15s}
.floor:hover{border-color:var(--sc);transform:translateX(3px)}
.floor .fno{width:44px;height:44px;border-radius:11px;background:var(--ink);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:15px;flex:none}
.floor .fmeta{flex:1;min-width:0}
.floor .fmeta .n{font-weight:600;font-size:15px}
.floor .fmeta .r{font-size:12px;color:var(--txt-dim)}
.floor .fbars{display:flex;gap:4px;flex:none}
.floor .fbars .b{width:14px;height:26px;border-radius:4px;background:var(--sc)}
.roomgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.room{border-radius:12px;overflow:hidden;background:var(--ink-2);border:1px solid var(--line);cursor:pointer;
  transition:.12s;position:relative}
.room:hover{border-color:var(--sc);transform:translateY(-2px)}
.room .rbar{height:6px;background:var(--sc)}
.room .rbody{padding:12px 13px}
.room .rn{font-family:var(--mono);font-weight:700;font-size:15px}
.room .rs{font-size:11px;color:var(--txt-dim);margin-top:3px;text-transform:capitalize}
.room .rflags{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;min-height:20px}
.room .rflag{font-size:10px;font-weight:700;font-family:var(--mono);padding:2px 6px;border-radius:5px}
.room .placard{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:4px;
  border:2px solid rgba(255,255,255,.4);background:var(--tc)}
.room .occ{position:absolute;top:8px;right:30px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--txt)}

/* room editor drawer */
.drawer{position:absolute;inset:0;z-index:60;background:rgba(4,10,18,.55);display:grid;place-items:end center;
  animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:640px;background:var(--ink-2);border:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:22px 24px 0;animation:up .25s ease;
  max-height:calc(100% - 20px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* short screens: give the sheet more room and trim the padding */
@media(max-height:640px){.sheet{max-height:calc(100% - 8px);padding:16px 18px 0}
  .sheet h3{font-size:18px}.sheet .sub{margin-bottom:12px}.seg{margin-bottom:14px}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-size:20px;font-weight:700;margin-bottom:2px}
.sheet .sub{font-size:12.5px;color:var(--txt-dim);margin-bottom:18px;font-family:var(--mono)}
.seg{margin-bottom:18px}
.seg .cap{font-size:11px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--txt-dim);margin-bottom:8px}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choice{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--ink);
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;transition:.12s}
.choice:hover{border-color:var(--cc,var(--sipat))}
.choice.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 18%,var(--ink))}
.choice .k{width:11px;height:11px;border-radius:50%;background:var(--cc)}
.occrow{display:flex;align-items:center;gap:12px}
.occrow .stepper{display:flex;align-items:center;gap:2px;background:var(--ink);border:1px solid var(--line);border-radius:10px}
.occrow .stepper button{width:38px;height:38px;font-size:20px;font-weight:700;color:var(--txt)}
.occrow .stepper .n{width:44px;text-align:center;font-family:var(--mono);font-size:18px;font-weight:700}
.togs{display:flex;gap:8px;flex-wrap:wrap}
.tog{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--ink);font-size:12.5px;font-weight:600}
.tog.on{border-color:var(--orange);background:rgba(232,100,44,.16);color:#ffcbb0}
.tog.on.cas{border-color:var(--red);background:rgba(216,66,59,.18);color:#ffd0cd}
.sheet .actions{display:flex;gap:10px;margin-top:8px;position:sticky;bottom:0;z-index:3;
  background:var(--ink-2);padding:14px 0 22px;border-top:1px solid var(--line)}
.sheet .actions .btn{flex:1;justify-content:center}
/* nested groups inside an actions row keep their own layout */
.sheet .actions>div{display:flex;gap:8px}

/* ============ GAB.ai MODULE ============ */
.gab-wrap{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:420px}
.gab-scroll{flex:1;overflow-y:auto;padding:8px 2px 16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:80%;padding:13px 16px;border-radius:14px;font-size:14px;line-height:1.6}
.msg.gab{background:var(--ink-2);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:4px}
.msg.gab .who{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gab);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.msg.me{background:var(--ink-4);align-self:flex-end;border-top-right-radius:4px}
.msg .ref{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--txt-dim)}
.msg .ref b{color:var(--gab)}
.msg ul{margin:8px 0 0 18px}.msg li{margin-bottom:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{padding:8px 13px;border-radius:999px;background:var(--ink-2);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--txt-dim)}
.chip:hover{border-color:var(--gab);color:var(--txt)}
.gab-input{display:flex;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.gab-input input{flex:1;padding:13px 16px;border-radius:12px;background:var(--ink);border:1px solid var(--line);
  color:var(--txt);font-family:inherit;font-size:14px}
.gab-input input:focus{outline:2px solid var(--gab);outline-offset:1px}
.gab-input .send{width:48px;border-radius:12px;background:var(--gab);color:#2a1c00;display:grid;place-items:center}
.typing{display:flex;gap:4px;padding:4px 0}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--gab);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* ---- SIPAT satellite map + tracing ---- */
.sat-toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.sat-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sat-btn{padding:9px 14px;font-size:13px}
.btn.sat-btn[disabled]{opacity:.45;cursor:default}
.sat-base{padding:9px 12px;border-radius:10px;background:var(--ink);border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:13px}
.sat-hint{font-size:12px;color:var(--txt-dim);max-width:440px;line-height:1.5}
.satmap{position:relative;z-index:1;height:462px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--ink-2)}
.sat-fallback{display:grid;place-items:center;height:100%;padding:24px;text-align:center;color:var(--txt-dim);font-size:14px;line-height:1.6}
.leaflet-container{background:#0c1b2e;font-family:var(--sans)}
.leaflet-container a{color:var(--sipat)}
.bldg-tip{background:rgba(12,27,46,.82)!important;border:none!important;color:#fff!important;font-weight:600;
  font-size:11px;box-shadow:none!important;padding:2px 7px;border-radius:5px}
.bldg-tip::before{display:none!important}
.trace-cursor .leaflet-grab{cursor:crosshair!important}
.srcx{font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:999px;margin-left:6px;white-space:nowrap}
.srcx.int{background:rgba(31,167,154,.16);color:var(--sipat)}
.srcx.ext{background:rgba(139,111,240,.18);color:var(--kamalig)}
.row-edit{flex:none;width:30px;height:30px;border-radius:8px;color:var(--txt-dim);background:var(--ink);border:1px solid var(--line);font-size:13px;transition:.13s}
.row-edit:hover{color:var(--sipat);border-color:var(--sipat)}
.hl-num{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--sipat);text-decoration:none;flex:none;white-space:nowrap}
.hl-num.muted{color:var(--txt-dim);font-weight:600}
.hl-del{flex:none;width:28px;height:28px;border-radius:8px;color:var(--txt-dim);font-size:11px;background:var(--ink);border:1px solid var(--line)}
.hl-del:hover{color:var(--red);border-color:var(--red)}

/* ---- trigger alert ---- */
.op-net{flex:none;display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:10px;margin-left:auto;
  background:var(--ink-2);border:1px solid var(--line);color:var(--txt-dim);font-family:var(--mono);font-size:11px;
  font-weight:700;letter-spacing:.06em;transition:.15s}
.op-net:hover{background:var(--ink-3);color:var(--txt)}
.op-net .dotn{width:9px;height:9px;border-radius:50%;background:var(--go);box-shadow:0 0 0 3px rgba(32,161,90,.2)}
.op-net.off .dotn{background:var(--grey);box-shadow:0 0 0 3px rgba(125,139,156,.2)}
@media(max-width:600px){.op-net #opNetLbl{display:none}.op-net{padding:0 10px}}
.op-trigger{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-left:4px;
  background:rgba(216,66,59,.12);border:1px solid rgba(216,66,59,.45);color:#ff8f85;transition:.15s}
.op-trigger:hover{background:rgba(216,66,59,.28);color:#fff}
.op-trigger svg{width:19px;height:19px}
.alertrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.logchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.logchip{padding:7px 12px;border-radius:999px;background:var(--ink-2);border:1px solid var(--line);color:var(--txt-dim);font-size:12.5px;font-weight:600;transition:.13s}
.logchip:hover{background:var(--ink-3);color:var(--txt)}
.logchip.on{background:var(--ink-3)}
.logchip .mono{opacity:.7;margin-left:3px}
.logfeed{display:flex;flex-direction:column}
.logrow{display:grid;grid-template-columns:auto auto 1fr;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.logrow:first-child{border-top:none}
.logtime{font-size:12px;color:var(--txt-dim);white-space:nowrap;padding-top:1px;min-width:64px}
.logdot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.logbody{font-size:13.5px;line-height:1.5}
.logcat{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.srsum{font-size:12.5px;color:var(--txt-dim);margin-top:3px}
.srcbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.srcpill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:11.5px;
  font-weight:600;color:var(--sp);background:color-mix(in srgb,var(--sp) 14%,var(--ink));
  border:1px solid color-mix(in srgb,var(--sp) 30%,var(--line))}
.srcpill b{color:var(--txt);font-weight:700}
.linkout{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.ophist{margin-bottom:14px}
.ophist.current{border-left:4px solid var(--go)}
.oph-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.oph-name{font-family:var(--serif);font-size:22px;line-height:1.15;margin-top:7px}
.oph-meta{font-size:12px;color:var(--txt-dim);margin-top:3px}
.oph-dur{font-size:19px;font-weight:700;color:var(--txt-dim);flex:none}
.oph-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.linkout b{font-size:13px;display:block}
.bcard.drill{position:relative;cursor:pointer;text-align:left;width:100%;transition:.13s}
.bcard.drill:hover{background:var(--ink-2);transform:translateY(-2px)}
.bcard .drillx{position:absolute;top:10px;right:12px;color:var(--txt-dim);font-size:17px;line-height:1}
.pipe-seg.drill{cursor:pointer;background:none;border:none;transition:.13s;border-radius:9px;padding:6px 8px}
.pipe-seg.drill:hover{background:var(--ink-3)}
.linkout span{font-size:12px;color:var(--txt-dim);display:block;margin-top:2px}
.alertrow .sub2{font-size:11.5px;color:var(--txt-dim);margin-top:2px}

/* ---- SAR beacon ---- */
.rail-beacon{width:62px;padding:9px 0 7px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:5px;
  color:#ff8f85;background:rgba(216,66,59,.10);border:1px solid rgba(216,66,59,.35);margin-top:4px}
.rail-beacon:hover{background:rgba(216,66,59,.24);color:#fff}
.rail-beacon .ico{width:24px;height:24px}
.rail-beacon .lb{font-size:9.5px;font-weight:600}
.beacon-ov{position:fixed;inset:0;z-index:300;display:grid;place-items:center;overflow-y:auto;overscroll-behavior:contain;
  background:radial-gradient(circle at 50% 45%,#5a1512,#2a0907);animation:bpulse 1.5s ease-in-out infinite}
@keyframes bpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
.beacon-box{text-align:center;padding:20px}
.b-rings{position:relative;width:170px;height:170px;margin:0 auto 26px}
.b-rings span{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,120,110,.8);animation:ring 1.5s ease-out infinite}
.b-rings span:nth-child(2){animation-delay:.5s}.b-rings span:nth-child(3){animation-delay:1s}
@keyframes ring{from{transform:scale(.35);opacity:1}to{transform:scale(1.25);opacity:0}}
.b-rings .core{position:absolute;inset:35%;border-radius:50%;background:#ff6b5e;box-shadow:0 0 44px #ff6b5e}
.beacon-box h2{font-family:var(--mono);letter-spacing:.2em;font-size:22px;color:#ffd9d5;margin-bottom:8px}
.beacon-box p{color:#f3b7b1;font-size:14px;max-width:360px;margin:0 auto 24px;line-height:1.6}
.b-stop{padding:15px 34px;border-radius:14px;background:#fff;color:#7c1d16;font-weight:700;font-size:16px}
.b-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.b-toggle{padding:15px 26px;border-radius:14px;background:transparent;color:#fff;font-weight:700;font-size:16px;border:2px solid rgba(255,255,255,.55)}
.b-toggle:hover{background:rgba(255,255,255,.12)}
.beacon-ov.silent{background:radial-gradient(circle at 50% 45%,#17243c,#0a121e);animation:none}
.beacon-ov.silent .b-rings span{border-color:rgba(120,165,225,.75)}
.beacon-ov.silent .b-rings .core{background:#5b8fd6;box-shadow:0 0 44px #5b8fd6}
.beacon-ov.silent .beacon-box h2{color:#cfe0f5}
.beacon-ov.silent .beacon-box p{color:#a9c2e6}
#idQR{width:64px;height:64px;background:#fff;border-radius:8px;padding:3px;display:grid;place-items:center;flex:none}
#idQR canvas,#idQR img{display:block;width:58px!important;height:58px!important}

/* ---- offline snapshot tracing ---- */
.snapwrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0c1b2e;z-index:1}
.snapwrap img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.snapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.snapwrap.tracing{cursor:crosshair}
.geo-chip{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:12px;margin-bottom:12px;border:1px solid var(--line);background:var(--ink-2)}
.geo-chip .geo-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.geo-chip.on{border-color:color-mix(in srgb,var(--go) 45%,var(--line))}
.geo-chip.on .geo-dot{background:var(--go)}
.geo-chip.off .geo-dot{background:var(--amber)}
.geo-chip .geo-txt{font-size:12.5px;line-height:1.5}
.geo-chip .geo-txt .mono{font-size:11px;color:var(--txt-dim);margin-left:4px}
.geo-chip .geo-note{display:block;color:var(--txt-dim);margin-top:3px}
.snap-lbl{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;
  background:rgba(12,27,46,.82);color:#fff;padding:2px 7px;border-radius:5px;pointer-events:none;white-space:nowrap}

/* ============ KAMALIG MODULE ============ */
.pipe{display:flex;align-items:center;gap:6px;padding:14px 16px;overflow-x:auto;margin-bottom:16px}
.pipe-seg{text-align:center;min-width:64px;flex:none}
.pipe-seg b{display:block;font-family:var(--mono);font-size:22px;line-height:1}
.pipe-seg span{font-size:10.5px;color:var(--txt-dim);letter-spacing:.03em}
.pipe-arrow{color:var(--txt-dim);font-size:18px;flex:none}
.reqlist{display:flex;flex-direction:column;gap:10px}
.reqrow{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;transition:.13s}
.reqrow:hover{border-color:var(--kamalig);transform:translateX(3px)}
.rr-id{font-size:12px;color:var(--kamalig);font-weight:700;flex:none;width:56px}
.rr-main{flex:1;min-width:0}
.rr-item{font-weight:600;font-size:15px}
.rr-qty{color:var(--txt-dim);font-size:13px}
.rr-need{font-size:12.5px;color:var(--txt-dim);margin-top:2px}
.rr-chips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.src-chip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px}
.src-chip.sipat{background:rgba(31,167,154,.18);color:var(--sipat)}
.src-chip.itala{background:rgba(58,127,196,.18);color:var(--itala)}
.src-chip.urg{background:rgba(216,66,59,.2);color:var(--red)}
.src-chip.low{background:rgba(232,100,44,.2);color:var(--orange)}
.rr-stage{flex:none}
.invrow{display:flex;align-items:center;gap:16px;padding:14px 16px}
.inv-main{flex:1;min-width:0}
.inv-name{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.inv-bar{height:7px;border-radius:4px;background:var(--ink);margin-top:9px;overflow:hidden}
.inv-fill{height:100%;border-radius:4px;transition:width .3s}
.inv-qty{text-align:right;flex:none}
.inv-qty b{font-size:20px}
.inv-qty span{display:block;font-size:11px;color:var(--txt-dim)}
.stepper2{display:flex;align-items:center;gap:4px;margin:6px 0 18px;overflow-x:auto;padding-bottom:4px}
.step{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;min-width:58px;opacity:.45}
.step.done,.step.active{opacity:1}
.step .sdot{width:14px;height:14px;border-radius:50%}
.step.active .sdot{box-shadow:0 0 0 4px color-mix(in srgb,var(--kamalig) 30%,transparent)}
.step .sl{font-size:10px;color:var(--txt-dim);text-align:center}
.sline{height:2px;width:14px;background:var(--ink-3);flex:none}
.reqmeta{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reqmeta > div{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.reqmeta span{display:block;font-size:11px;color:var(--txt-dim);font-family:var(--mono);letter-spacing:.06em;margin-bottom:3px}
.reqmeta b{font-size:14px;text-transform:capitalize}
.req-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.req-actions .btn{flex:1;justify-content:center;min-width:150px}
.short-note{font-size:12.5px;color:var(--txt-dim);line-height:1.55;width:100%;margin-bottom:4px}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:250;background:var(--ink-3);
  border:1px solid var(--line);padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .25s ease}
</style>
</head>
<body class="drill">

  <!-- ===== FRAME ===== -->
  <div class="frame">
    <nav class="rail">
      <div class="brand">R</div>

        <button data-tool="home" class="on" onclick="go('home')" title="Suite home">

        </button>
        <button data-tool="sipat" onclick="go('sipat')" title="SIPAT">

      </div>

    </div>

</div>

/* worst-status rollups */
function rollFloor(f){
  let s='cleared', st='safe', occ=0, assist=false, cas=false, haz=new Set();
  // worst search = the least-progressed present
  const order=['unsearched','searching','cleared'];
  f.rooms.forEach(r=>{
    if(order.indexOf(r.search)<order.indexOf(s)) s=r.search;
    if(STRUCT[r.struct].rank>STRUCT[st].rank) st=r.struct;
    occ+=r.occ; assist=assist||r.assistance; cas=cas||r.casualty;
    r.hazards.forEach(h=>haz.add(h));
  });
  return {search:s,struct:st,occ,assist,cas,haz:[...haz]};
}
function rollBuilding(b){
  let s='cleared', st='safe', occ=0, assist=false, cas=false, haz=new Set();
  const order=['unsearched','searching','cleared'];
  b.floors.forEach(f=>{
    const rf=rollFloor(f);
    if(order.indexOf(rf.search)<order.indexOf(s)) s=rf.search;
    if(STRUCT[rf.struct].rank>STRUCT[st].rank) st=rf.struct;
    occ+=rf.occ; assist=assist||rf.assist; cas=cas||rf.cas;
    rf.haz.forEach(h=>haz.add(h));
  });
  return {search:s,struct:st,occ,assist,cas,haz:[...haz]};
}
const IT_STATE={unaccounted:['Unaccounted','var(--grey)'],present:['Present','var(--go)'],in:['Entered','var(--itala)'],out:['Stepped out','var(--amber)'],released:['Released','var(--sipat)'],hospital:['Referred to hospital','var(--red)']};
function itRoll(){
  const r=S.itala.roster;
  const c={registered:r.length,present:0,in:0,out:0,released:0,unaccounted:0,injured:0,hospital:0,evacuees:0,responders:0};
  r.forEach(p=>{ if(p.injured)c.injured++;
    if(p.tag==='responder')c.responders++; else c.evacuees++;
    if(p.state==='present')c.present++; else if(p.state==='in')c.in++;
    else if(p.state==='out')c.out++; else if(p.state==='released')c.released++;
    else if(p.state==='hospital')c.hospital++;
    else c.unaccounted++; });
  c.accounted=c.registered-c.unaccounted; c.missing=c.unaccounted;
  return c;
}
function itRecount(){ const c=itRoll(); const it=S.itala;
  it.registered=c.registered; it.present=c.accounted; it.injured=c.injured; it.missing=c.unaccounted; }
function censorName(name){
  if(!S.itala.censor) return name;
  return String(name).split(/\s+/).map(w=>{
    const m=w.match(/^([A-Za-z])([A-Za-z]*)(.*)$/);

}

function campusRoll(){

function openCloseout(){
  if(isClosed()){ openReopen(); return; }

  const rows=checks.map(x=>{

    const col=x.v===0?'var(--go)':(x.block?'var(--red)':'var(--amber)');
    return `<div class="corow">

      <div class="cotxt"><b>${x.l}</b> <span class="src-chip" style="background:rgba(125,139,156,.16);color:var(--txt-dim)">${x.src}</span>
        <span>${x.d}</span></div>
      <span class="coval mono" style="color:${col}">${x.v}</span>
    </div>`;
  }).join('');
  const gate = blockers.length
    ? `<div class="short-note" style="border-left:3px solid var(--red);padding-left:10px">
        ${blockers.length} item${blockers.length===1?'':'s'} still outstanding. An incident can still be ended, but the override and the reason are written into the activity log and carried in the after action package.</div>
       <label class="ackrow"><input type="checkbox" ${CLOSEOUT.ack?'checked':''} onchange="CLOSEOUT.ack=this.checked;refreshCloseout()">

    : `<div class="short-note" style="border-left:3px solid var(--go);padding-left:10px">Everything is resolved. The operation is ready to be closed.</div>`;

      <div class="field" style="margin-top:10px"><label>${blockers.length?'Reason and closing remarks':'Closing remarks'}</label>
        <input id="coNote" value="${esc(CLOSEOUT.note)}" placeholder="${drill?'e.g. objectives met, hot wash to follow':'e.g. hazard stabilized, all occupants accounted for'}" oninput="CLOSEOUT.note=this.value"></div>
      <label class="ackrow"><input type="checkbox" ${CLOSEOUT.mask?'checked':''} onchange="CLOSEOUT.mask=this.checked">
        <span>Mask personal names in the after action package (recommended when it will be emailed).</span></label>
    </div>
    <div class="actions">

    </div>`);
}

function endIncident(){
  const checks=closeoutCheck();

    (S.incident.closeNote?' Remarks: '+S.incident.closeNote:'');

function archiveIncident(ending){
  if(S.incident.archived)return null;
  const c=itRoll(), cr=campusRoll(), km=kamaligRoll(), mp=mpRoll();
  const masked=!!CLOSEOUT.mask;
  const entry={
    id:'op'+Date.now().toString(36),
    name:S.incident.name, mode:S.mode, hazard:S.incident.hazard, campus:S.incident.campus, ic:S.incident.ic,
    activatedAt:S.incident.activatedAt, closedAt:S.incident.closedAt||Date.now(),
    ending:ending||'closed', closeNote:S.incident.closeNote||'', closeOverride:S.incident.closeOverride||[],
    masked, logCount:(S.log||[]).length,
    figures:{registered:c.registered, accounted:c.accounted, unaccounted:c.unaccounted, injured:c.injured,
      hospital:c.hospital, released:c.released, cleared:cr.cleared, buildings:cr.total,
      fulfilled:km.fulfilled, open:km.open, personnel:mp.inCt},
    files:buildAfterAction(masked)
  };
  entry.duration=entry.closedAt-entry.activatedAt;
  S.history.unshift(entry);
  /* keep the device from filling up; the package is the bulky part */
  if(S.history.length>20) S.history.length=20;
  S.incident.archived=true;
  logEvent('incident','Operation archived to history: '+entry.name+(ending==='superseded'?' (superseded without formal closeout)':'')+'.');

/* =========================================================
   FILE OUTPUT
   Minimal ZIP writer (STORE method) and download helpers.
   Written in plain JavaScript so the suite keeps working
   with no network and no third party library.
   ========================================================= */
function crcTable(){
  if(crcTable.t)return crcTable.t;
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n;
    for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
    t[n]=c>>>0; }
  return (crcTable.t=t);
}
function crc32(bytes){
  const t=crcTable(); let c=0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c=(c>>>8)^t[(c^bytes[i])&0xFF];
  return (c^0xFFFFFFFF)>>>0;
}
function utf8(str){ return new TextEncoder().encode(String(str)); }
function dosTime(d){ return ((d.getHours()&31)<<11)|((d.getMinutes()&63)<<5)|((d.getSeconds()>>1)&31); }
function dosDate(d){ return (((d.getFullYear()-1980)&127)<<9)|(((d.getMonth()+1)&15)<<5)|(d.getDate()&31); }
/* files = [{name, text}] -> Uint8Array of a valid .zip archive */
function buildZip(files){
  const now=new Date(), parts=[], central=[]; let offset=0, cdSize=0;
  files.forEach(f=>{
    const name=utf8(f.name), data=utf8(f.text), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true); lh.setUint16(10,dosTime(now),true); lh.setUint16(12,dosDate(now),true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const cd=new DataView(new ArrayBuffer(46));
    cd.setUint32(0,0x02014b50,true); cd.setUint16(4,20,true); cd.setUint16(6,20,true);
    cd.setUint16(8,0x0800,true); cd.setUint16(10,0,true); cd.setUint16(12,dosTime(now),true);
    cd.setUint16(14,dosDate(now),true); cd.setUint32(16,crc,true);
    cd.setUint32(20,data.length,true); cd.setUint32(24,data.length,true);
    cd.setUint16(28,name.length,true); cd.setUint16(30,0,true); cd.setUint16(32,0,true);
    cd.setUint16(34,0,true); cd.setUint16(36,0,true); cd.setUint32(38,0,true); cd.setUint32(42,offset,true);
    central.push(new Uint8Array(cd.buffer),name);
    offset+=30+name.length+data.length;
    cdSize+=46+name.length;
  });
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(4,0,true); eo.setUint16(6,0,true);
  eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
  eo.setUint32(12,cdSize,true); eo.setUint32(16,offset,true); eo.setUint16(20,0,true);
  const all=[...parts,...central,new Uint8Array(eo.buffer)];
  const size=all.reduce((n,a)=>n+a.length,0);
  const out=new Uint8Array(size); let at=0;
  all.forEach(a=>{ out.set(a,at); at+=a.length; });
  return out;
}
function saveBlob(blob,filename){
  try{
    if(typeof URL==='undefined'||!URL.createObjectURL)return false;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(e){}},4000);
    return true;
  }catch(e){ return false; }
}
/* Always give the responder the content: download if the browser allows it,
   otherwise show it on screen so it can be read out or copied. */
function deliverText(filename,text){
  let ok=false;
  try{ ok=(typeof Blob!=='undefined') && saveBlob(new Blob([text],{type:'text/plain;charset=utf-8'}),filename); }catch(e){ ok=false; }
  if(!ok) showOutput(filename,text);
  return ok;
}
function deliverZip(filename,files){
  let ok=false;
  try{ ok=(typeof Blob!=='undefined') && saveBlob(new Blob([buildZip(files)],{type:'application/zip'}),filename); }catch(e){ ok=false; }
  if(!ok) showOutput(filename,files.map(f=>'===== '+f.name+' =====\n'+f.text).join('\n\n'));
  return ok;
}
function showOutput(filename,text){
  drawer(`<h3>${esc(filename)}</h3>
    <div class="sub">The download was blocked here, so the content is shown for copying or reading out on the radio.</div>
    <div class="sitrep">${esc(text)}</div>
    <div class="actions"><button class="btn primary" onclick="this.closest('.drawer').remove()">Close</button></div>`);
}
function csvCell(v){ const s=String(v===undefined||v===null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function csv(rows){ return rows.map(r=>r.map(csvCell).join(',')).join('\n'); }
function stampName(){
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
}
function slug(t){ return String(t||'incident').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'incident'; }

    </div>
    <div class="grid2">
      <div class="field"><label>Campus or site</label>
        <select id="acCampus" onchange="actSet('campus',this.value)">${campuses.map(c=>`<option ${c===a.campus?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Incident Commander</label>
        <input id="acIC" value="${esc(a.ic)}" placeholder="Name of IC on duty" oninput="actSet('ic',this.value)"></div>
    </div>

    <div class="act-stamp mono">${(S.incident.activatedAt&&!a.fresh)?'Editing the operation in progress. The clock keeps running from the original activation.':'Activation time stamps automatically when you start. The clock begins now.'}</div>

    <div class="act-actions">
      <button class="btn primary act-go" onclick="activate()">${(S.incident.activatedAt&&!a.fresh)?'Save changes':(a.mode==='actual'?'Declare ACTUAL incident':'Start drill')}</button>
      <button class="btn" onclick="go('about')">Back</button>
    </div>
  </div>`;

function actSet(k,v){ if(!S.activation)return; S.activation[k]=v; }
function actFresh(v){ if(!S.activation)return; S.activation.fresh=v; render(); }
function actMode(m){ if(!S.activation)return; S.activation.mode=m; applyMode(m); render(); }
function activate(){
  const a=S.activation||{};
  const name=(a.name||'').trim()||'Unnamed operation';
  const running=!!S.incident.activatedAt;
  if(running && !a.fresh){
    /* editing the operation in progress: keep the clock, the log, and every tally */
    const before=S.incident.name;
    S.incident.name=name; S.incident.hazard=a.hazard||S.incident.hazard;
    S.incident.campus=a.campus||S.incident.campus; S.incident.ic=(a.ic||'').trim();
    S.activation=null; S.modeLocked=true;
    applyMode(a.mode||S.mode);
    logEvent('incident','Operation details updated'+(before!==name?' ('+before+' is now '+name+')':'')+'.');
    toast('Operation details updated.');
    go('home');
    return;
  }
  if(running) archiveIncident(isClosed()?'closed':'superseded');
  resetForNewOperation();
  S.incident={
    name, hazard:a.hazard||'Earthquake', campus:a.campus||'UP Demo Campus',
    ic:(a.ic||'').trim(), activatedAt:Date.now(),
    closedAt:null, closeNote:'', closeOverride:[], duration:0, archived:false
  };
  S.activation=null;
  S.modeLocked=true;
  applyMode(a.mode||'drill');
  logEvent('incident','Incident activated: '+S.incident.name+' ('+((a.mode||'drill')==='actual'?'ACTUAL':'DRILL')+', hazard '+S.incident.hazard+').');
  toast((a.mode==='actual'?'ACTUAL incident declared: ':'Drill started: ')+S.incident.name);
  go('home');
}

function viewLog(){

  const catLabel={all:'All',...Object.fromEntries(Object.entries(LOGCAT).map(([k,v])=>[k,v[0]]))};
  const chips=cats.map(c=>{
    const n=c==='all'?all.length:all.filter(e=>e.cat===c).length;
    const on=LOGFILTER===c;
    const col=c==='all'?'var(--txt)':LOGCAT[c][1];

  const rows=shown.length? shown.map(e=>{
    const [lbl,col]=LOGCAT[e.cat]||['Event','var(--grey)'];
    return `<div class="logrow"><div class="logtime mono">${logTime(e.t)}</div><div class="logdot" style="background:${col}"></div>
      <div class="logbody"><span class="logcat" style="color:${col}">${lbl}</span> ${esc(e.msg)}</div></div>`;

    <div class="flow-note" style="margin-top:14px">Entries are captured automatically as people are scanned, requests move, alerts go out, and the field picture changes. Times use this device's clock. In production this log is signed per entry and retained for the incident record under RA 10173.</div>`;

  logEvent('people', verb+' (evac '+(m==='attendance'?'roll call':m)+'): '+p.n+' at '+it.scanLoc+

function italaFakeScan(){
  if(frozen('Scanning'))return;
  const it=S.itala, m=it.scanMode;
  let pool;
  if(m==='attendance'||m==='in') pool=it.roster.filter(p=>p.state==='unaccounted');
  else if(m==='out') pool=it.roster.filter(p=>p.state==='in'||p.state==='present');
  else if(m==='hospital') pool=it.roster.filter(p=>p.injured&&p.state!=='hospital'&&p.state!=='unaccounted');
  else pool=it.roster.filter(p=>p.state==='in'||p.state==='out'||p.state==='present');
  if(!pool.length) pool=it.roster;
  itApply(pool[Math.floor(Math.random()*pool.length)],'scan');

/* ---------- Manual name or ID lookup: the fallback when a card is lost,

function itMatches(q){
  const s=(q||'').trim().toLowerCase();
  if(s.length<2)return null;
  return S.itala.roster.filter(p=>
    p.n.toLowerCase().includes(s) || p.id.toLowerCase().includes(s) || (p.r||'').toLowerCase().includes(s));
}

  const shown=hits.slice(0,8);

  }).join('');
  const log=S.rescue.log.length
    ? `<div class="card" style="margin-top:16px;padding:16px 18px"><div class="eyebrow" style="margin-bottom:6px">Beacon audit log</div>
        ${S.rescue.log.slice(0,6).map(e=>{const dt=new Date(e.t);
          const hm=String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
          return `<div class="alertrow"><span class="mono" style="font-size:11px;color:var(--txt-dim);flex:none">${hm}</span><div>${esc(e.msg)}</div></div>`;}).join('')}</div>`
    : '';
  return `${drillNote}
    ${opBar}
    <div class="card panel" style="margin-bottom:14px">
      <div class="eyebrow" style="margin-bottom:8px">Activation modes</div>
      ${Object.keys(BMODES).map(k=>`<div class="corow">
        <span class="codot" style="background:${BMODES[k].c}"></span>
        <div class="cotxt"><b>${BMODES[k].l}</b> <span class="src-chip" style="background:rgba(125,139,156,.16);color:var(--txt-dim)">${BMODES[k].short}</span>
          <span>${BMODES[k].d}</span></div>
      </div>`).join('')}
      <div class="short-note" style="margin-top:10px">${covertOk
        ? 'The acting operator holds Incident Command authority, so covert activation is available. It asks for a written reason before it will run.'
        : 'Covert activation is unavailable. It requires Incident Command authority, which the acting operator does not hold.'} Covert mode locates a device only. It does not open the microphone or the camera.</div>
    </div>
    ${sweepBar}
    <div class="reqlist">${rows}</div>

    ${log}`;
}
/* Covert activation asks for a reason before it will run, and the reason
   travels with the record. */
function openCovert(target,kind){
  const op=actingOperator();
  const who = kind==='sweep' ? 'every reachable device in '+target : (rescueDev(target)||{}).name;
  drawer(`<h3>Covert activation</h3>
    <div class="sub">${esc(who||'')}</div>
    <div class="seg"><div class="cap">What covert means here</div>
      <p class="modinfo-p">${esc(BMODES.covert.d)}</p></div>
    <div class="seg"><div class="cap">Before you do this</div>
      <p class="modinfo-p">Under the Data Privacy Act of 2012 (Republic Act No. 10173), processing personal data without consent is lawful where it is necessary to protect the life and health of the person concerned. That is the only ground this feature is built on. It locates a device. It does not open the microphone or the camera, because intercepting private communication without a court order is an offence under Republic Act No. 4200.</p></div>
    <div class="field"><label>Reason for covert rather than overt activation</label>
      <textarea id="cvWhy" placeholder="e.g. armed intruder reported on the floor, an audible beacon would reveal the occupant's position"></textarea></div>
    <div class="short-note">Authorised by ${esc(opLabel(op))}. The reason is written into the activity log and carried in the after action package.</div>
    <div class="actions">
      <button class="btn" onclick="this.closest('.drawer').remove()">Cancel</button>
      <button class="btn primary" onclick="covertConfirm('${esc(String(target))}','${kind}')">Activate covertly</button>
    </div>`);
  const el=document.getElementById('cvWhy'); if(el)el.focus();
}
function covertConfirm(target,kind){
  const el=document.getElementById('cvWhy');
  const why=(el&&el.value||'').trim();
  if(!why){ toast('A reason is required for covert activation.'); return; }
  const d=document.querySelector('.drawer'); if(d)d.remove();
  if(kind==='sweep') rescueSweep('covert',target,why);
  else rescueRequest(target,'covert',why);
}
function rescueActAs(id){ S.rescue.actingAs=id; render(); }
/* device locations read like "Melchor Hall 3F", so match on the building prefix */
function sameBuilding(loc,name){
  const a=(loc||'').toLowerCase(), b=(name||'').toLowerCase();
  return !!a && !!b && a.indexOf(b)===0;
}
function opLabel(op){ return op? op.name+' ('+op.role+', '+(op.accred||[]).filter(a=>BEACON_AUTH.indexOf(a)>=0).join('/')+')' : 'unattributed'; }
function rescueSweep(mode,forced,why){
  if(frozen('Sweeping for beacons'))return;
  mode=(typeof mode==='boolean')?(mode?'silent':'overt'):(mode||'overt');
  const op=actingOperator();
  if(!op){ toast('No accredited operator is checked in. Remote activation is unavailable.'); return; }
  const sel=document.getElementById('swBldg');
  const name=forced||(sel&&sel.value);
  if(!name)return;
  if(mode==='covert'){
    if(!canCovert()){ toast('Covert activation requires Incident Command authority. The acting operator does not hold it.'); return; }
    if(!why){ openCovert(name,'sweep'); return; }
  }
  const targets=S.rescue.devices.filter(d=>!d.self && sameBuilding(d.loc,name) && d.beacon!=='active');
  if(!targets.length){ toast('No idle devices to sweep in '+name+'.'); return; }
  let fired=0, queued=0;
  targets.forEach(d=>{
    d.bmode=mode; d.silent=(mode!=='overt');
    if(!d.reachable){ d.beacon='queued'; queued++; }
    else { d.beacon='requested'; fired++; setTimeout(()=>rescueAck(d.id),700+Math.random()*600); }
  });
  const tag=mode==='overt'?'':mode+' ';
  const just=why?' Justification: '+why:'';
  rescueLogAdd('Area sweep '+tag+'of '+name+' by '+opLabel(op)+': '+fired+' activated, '+queued+' queued.'+just);
  logEvent('rescue','Area sweep '+tag+'of '+name+' authorised by '+opLabel(op)+'. '+fired+' device'+(fired===1?'':'s')+' activated, '+queued+' queued.'+just);
  toast('Sweeping '+name+'. '+fired+' activated'+(queued?', '+queued+' queued':'')+'.');
  render();
}
function rescueLogAdd(msg){ S.rescue.log.unshift({t:Date.now(),msg}); if(S.rescue.log.length>12)S.rescue.log.length=12; }
function rescueDev(id){ return S.rescue.devices.find(d=>d.id===id); }
function rescueRequest(id,mode,why){
  mode=(typeof mode==='boolean')?(mode?'silent':'overt'):(mode||'overt');
  const d=rescueDev(id); if(!d)return;
  const op=actingOperator();
  if(!op){ toast('No accredited operator is checked in. Remote activation is unavailable.'); return; }
  if(mode==='covert'){
    if(!canCovert()){ toast('Covert activation requires Incident Command authority. The acting operator does not hold it.'); return; }
    if(!why){ openCovert(id,'device'); return; }
  }
  d.bmode=mode; d.silent=(mode!=='overt');
  const tag=mode==='overt'?'':'('+mode+') ';
  const just=why?' Justification: '+why:'';
  if(d.self){
    d.beacon='active';
    rescueLogAdd('Beacon '+tag+'activated on this device by '+opLabel(op)+'.'+just);
    logEvent('rescue','Beacon '+tag+'activated on this device, authorised by '+opLabel(op)+'.'+just);
    startBeacon(op.name,mode);
    render(); return;
  }
  if(!d.reachable){
    d.beacon='queued';
    rescueLogAdd('Request '+tag+'queued for '+d.name+' by '+opLabel(op)+'. Device is off-network; it will fire on rejoin.'+just);
    logEvent('rescue','Beacon '+tag+'request queued for '+d.name+', authorised by '+opLabel(op)+'.'+just);
    render(); return;
  }
  d.beacon='requested';
  rescueLogAdd('Beacon '+tag+'requested for '+d.name+' by '+opLabel(op)+'.'+just);
  logEvent('rescue','Beacon '+tag+'requested for '+d.name+', authorised by '+opLabel(op)+'.'+just);
  render();
  setTimeout(()=>rescueAck(id),900);
}
function rescueAck(id){
  const d=rescueDev(id); if(!d||d.beacon!=='requested')return;
  d.beacon='active';
  const bm=bmodeOf(d);
  rescueLogAdd(d.name+"'s device acknowledged. Beacon "+(bm==='covert'?'locating covertly, nothing shown to the holder.':bm==='silent'?'locating silently.':'sounding.'));
  render();
}
function rescueStop(id){
  const d=rescueDev(id); if(!d)return;
  const op=actingOperator();
  if(d.self){ stopBeacon(); return; }
  d.beacon='off'; d.silent=false; d.bmode=null;
  rescueLogAdd('Beacon stopped for '+d.name+' by '+opLabel(op)+'.');
  logEvent('rescue','Beacon stopped for '+d.name+' by '+opLabel(op)+'.');
  render();
}

function sipatMap(){

function snapGeoBadge(){
  const b=SIPAT.map.snapBounds;
  if(b){
    return `<div class="geo-chip on">
      <span class="geo-dot"></span>

function setSnapMode(m){ SIPAT.map.mode=m; render(); }
function snapPolysSVG(){
  const tr=SIPAT.map.snapTrace; let s='';
  SIPAT.buildings.forEach(b=>{
    if(!b.imgPoly||!b.imgPoly.length)return;
    const r=rollBuilding(b);
    const pts=b.imgPoly.map(p=>p[0]+','+p[1]).join(' ');
    s+=`<polygon points="${pts}" style="fill:${SEARCH[r.search].c};fill-opacity:.5;stroke:${STRUCT[r.struct].c};stroke-width:.6" onclick="snapPolyTap(event,'${b.id}')"/>`;
  });
  if(tr.active&&tr.pts.length){
    const pts=tr.pts.map(p=>p[0]+','+p[1]).join(' ');
    s+=`<polygon points="${pts}" style="fill:rgba(139,111,240,.18);stroke:var(--kamalig);stroke-width:.7;stroke-dasharray:2 2"/>`;
    tr.pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r=".9" style="fill:var(--kamalig)"/>`;});
  }
  return s;
}
function snapLabels(){
  return SIPAT.buildings.filter(b=>b.imgPoly&&b.imgPoly.length).map(b=>{
    const cx=b.imgPoly.reduce((a,p)=>a+p[0],0)/b.imgPoly.length;
    const cy=b.imgPoly.reduce((a,p)=>a+p[1],0)/b.imgPoly.length;
    return `<div class="snap-lbl" style="left:${cx}%;top:${cy}%">${esc(b.name)}</div>`;}).join('');
}
function loadSnapFile(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{SIPAT.map.snap=rd.result;SIPAT.map.mode='snap';SIPAT.map.snapTrace={active:false,pts:[]};
    render();toast('Snapshot loaded. Trace your buildings on it.');};
  rd.readAsDataURL(f);
}
function synthSnapDataURL(){
  try{
    const c=document.createElement('canvas'); c.width=1000; c.height=620;
    const g=c.getContext('2d'); if(!g)return null;
    g.fillStyle='#51603e'; g.fillRect(0,0,1000,620);
    for(let i=0;i<500;i++){g.fillStyle='rgba(0,0,0,'+(Math.random()*.08).toFixed(3)+')';
      g.fillRect(Math.random()*1000,Math.random()*620,3+Math.random()*8,3+Math.random()*8);}
    for(let i=0;i<70;i++){g.fillStyle='rgba(40,60,32,.55)';g.beginPath();
      g.arc(Math.random()*1000,Math.random()*620,6+Math.random()*14,0,7);g.fill();}
    g.fillStyle='#93969b'; g.fillRect(0,620*.42,1000,620*.06); g.fillRect(1000*.30,0,1000*.05,620);
    const roofs={melchor:'#b3a488',palma:'#a9a9ad',library:'#b8ab8e',science:'#9aa0a6'};
    SIPAT.buildings.forEach(b=>{ if(!b.imgPoly)return;
      const xs=b.imgPoly.map(p=>p[0]),ys=b.imgPoly.map(p=>p[1]);
      const x=Math.min(...xs)/100*1000,y=Math.min(...ys)/100*620;
      const w=(Math.max(...xs)-Math.min(...xs))/100*1000,h=(Math.max(...ys)-Math.min(...ys))/100*620;
      g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x+6,y+6,w,h);
      g.fillStyle=roofs[b.id]||'#b0a48c';g.fillRect(x,y,w,h);
      g.strokeStyle='rgba(0,0,0,.3)';g.strokeRect(x,y,w,h);});
    return c.toDataURL('image/png');
  }catch(e){ return null; }
}
function demoSnap(){
  const url=synthSnapDataURL();
  if(!url){ toast('Image drawing is unavailable here. Load a screenshot file instead.'); return; }
  SIPAT.map.snap=url;
  SIPAT.map.snapBounds=snapBoundsFromGeo();

/* capture the current live map extent as a georeferenced offline reference */
function captureLiveReference(){
  if(typeof L==='undefined'||!LMAP){ toast('The live satellite view is not available to capture bounds here.'); return; }
  const bnd=LMAP.getBounds();
  SIPAT.map.snapBounds={ n:+bnd.getNorth().toFixed(6), s:+bnd.getSouth().toFixed(6), e:+bnd.getEast().toFixed(6), w:+bnd.getWest().toFixed(6) };
  const url=synthSnapDataURL(); if(url) SIPAT.map.snap=url;
  SIPAT.map.mode='snap'; SIPAT.map.snapTrace={active:false,pts:[]};

}
function snapClick(e){
  const tr=SIPAT.map.snapTrace; if(!tr.active)return;
  const w=document.getElementById('snapwrap'); if(!w)return;
  const r=w.getBoundingClientRect(); if(!r.width||!r.height)return;
  const x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
  if(x<0||x>100||y<0||y>100)return;
  snapAddPt(x,y);
}
function snapAddPt(x,y){ SIPAT.map.snapTrace.pts.push([+(+x).toFixed(2),+(+y).toFixed(2)]); render(); }
function snapPolyTap(e,id){ if(e&&e.stopPropagation)e.stopPropagation(); if(SIPAT.map.snapTrace.active)return; sipatNav([id]); }
function snapTraceStart(){ SIPAT.map.snapTrace={active:true,pts:[]}; render(); }
function snapTraceCancel(){ SIPAT.map.snapTrace={active:false,pts:[]}; render(); }
function snapTraceFinish(){

  openTraceName(tr.pts.slice(),'img');
}

/* ---- Leaflet satellite map + building tracing ---- */
let LMAP=null, LBASE=null, LREF=null, LDRAW={};
function cssVar(v){
  const name=String(v).replace(/var\((--[a-z0-9-]+)\)/i,'$1');
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim()||'#888';
}
function baseTiles(kind){
  if(kind==='street') return L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'});
  return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri'});
}
function applyBasemap(){
  if(!LMAP)return;
  if(LBASE){LMAP.removeLayer(LBASE);LBASE=null;}
  if(LREF){LMAP.removeLayer(LREF);LREF=null;}
  LBASE=baseTiles(SIPAT.map.basemap==='street'?'street':'sat').addTo(LMAP);
  if(SIPAT.map.basemap==='hybrid'){
    LREF=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(LMAP);
  }
}
function setBasemap(v){ SIPAT.map.basemap=v; applyBasemap(); }
function drawBuildings(){
  if(!LMAP)return;
  Object.values(LDRAW).forEach(l=>{try{LMAP.removeLayer(l);}catch(e){}});
  LDRAW={};
  SIPAT.buildings.forEach(b=>{
    if(!b.poly||!b.poly.length)return;
    const r=rollBuilding(b);
    const poly=L.polygon(b.poly,{color:cssVar(STRUCT[r.struct].c),weight:2,fillColor:cssVar(SEARCH[r.search].c),fillOpacity:.5});
    poly.addTo(LMAP);
    poly.bindTooltip(b.name,{permanent:true,direction:'center',className:'bldg-tip'});
    poly.on('click',()=>{ if(!SIPAT.map.trace.active) sipatNav([b.id]); });
    LDRAW[b.id]=poly;
  });
}
function mountSipatMap(){
  const el=document.getElementById('satmap'); if(!el)return;
  if(typeof L==='undefined'){
    el.innerHTML='<div class="sat-fallback">Satellite basemap needs a connection and did not load here.<br>Switch to the Schematic view to keep working offline.</div>';
    updateTraceUI(); return;
  }
  if(LMAP){ try{LMAP.remove();}catch(e){} LMAP=null; }
  SIPAT.map.trace={active:false,pts:[],layer:null};
  LMAP=L.map(el,{zoomControl:true}).setView(SIPAT.map.center,SIPAT.map.zoom);
  applyBasemap();
  drawBuildings();
  LMAP.on('click',onMapClick);
  LMAP.on('mousemove',onMapMove);
  setTimeout(()=>{try{LMAP&&LMAP.invalidateSize();}catch(e){}},80);
  updateTraceUI();

function updateTraceUI(){
  const tools=document.getElementById('satTools'), hint=document.getElementById('traceHint');
  if(!tools)return;
  const tr=SIPAT.map.trace, noMap=(typeof L==='undefined');
  if(tr.active){
    tools.innerHTML=`<button class="btn primary sat-btn" ${tr.pts.length<3?'disabled':''} onclick="traceFinish()">Finish (${tr.pts.length} corners)</button>
      <button class="btn sat-btn" onclick="traceCancel()">Cancel</button>`;
    if(hint)hint.textContent='Click the map to drop each corner of the building. Add at least three, then Finish.';
  } else {
    tools.innerHTML=`<button class="btn sat-btn" ${noMap?'disabled':''} onclick="traceStart()">Trace a building</button>
      <button class="btn sat-btn" ${noMap?'disabled':''} onclick="captureLiveReference()">Save as offline reference</button>
      <select class="sat-base" ${noMap?'disabled':''} onchange="setBasemap(this.value)">
        <option value="sat" ${SIPAT.map.basemap==='sat'?'selected':''}>Satellite</option>
        <option value="hybrid" ${SIPAT.map.basemap==='hybrid'?'selected':''}>Satellite + labels</option>
        <option value="street" ${SIPAT.map.basemap==='street'?'selected':''}>Street</option>

function traceStart(){
  if(typeof L==='undefined'||!LMAP)return;
  const tr=SIPAT.map.trace; tr.active=true; tr.pts=[];
  if(tr.layer){try{LMAP.removeLayer(tr.layer);}catch(e){}}
  tr.layer=L.polygon([],{color:cssVar('var(--kamalig)'),weight:3,dashArray:'6,6',fillOpacity:.15}).addTo(LMAP);
  document.getElementById('satmap').classList.add('trace-cursor');
  updateTraceUI();
}
function onMapClick(e){
  const tr=SIPAT.map.trace; if(!tr.active)return;
  tr.pts.push([e.latlng.lat,e.latlng.lng]);

  updateTraceUI();
}
function onMapMove(e){
  const tr=SIPAT.map.trace; if(!tr.active||!tr.pts.length)return;

function traceFinish(){

function traceCancel(){

function routeRecommend(bId){
  const b=SIPAT.buildings.find(x=>x.id===bId); if(!b||!b.routes||!b.routes.length){ toast('No routes defined yet. Add at least one route first.'); return; }
  const rank={clear:0,restricted:1,blocked:2};
  const modePref={ambulance:3,vehicle:2,foot:1};
  const usable=b.routes.filter(r=>r.status!=='blocked');
  if(!usable.length){ toast('Every defined route to '+b.name+' is currently blocked. Escalate for an alternate approach.'); return; }
  usable.sort((a,c)=> (rank[a.status]-rank[c.status]) || (modePref[c.mode]-modePref[a.mode]) );
  const best=usable[0];
  const md=RMODE[best.mode][0], st=RSTATUS[best.status][0];
  logEvent('field','SIPAT: safest route to '+b.name+' recommended ('+best.name+', '+best.status+').');
  drawer(`<h3>Recommended route</h3>
    <div class="sub">to ${esc(b.name)}</div>

function gabReply(q){
  const cr=campusRoll(), it=S.itala, km=kamaligRoll(); const ql=q.toLowerCase();
  const unswept=SIPAT.buildings.filter(b=>rollBuilding(b).search!=='cleared').map(b=>b.name);
  const unsafe=SIPAT.buildings.filter(b=>rollBuilding(b).struct==='unsafe').map(b=>b.name);
  const assistB=SIPAT.buildings.filter(b=>rollBuilding(b).assist).map(b=>b.name);

  if(ql.includes('resource')||ql.includes('supply')||ql.includes('supplies')||ql.includes('kamalig')||ql.includes('stock')||ql.includes('request')){
    const urgentReqs=S.kamalig.requests.filter(r=>r.priority==='urgent'&&['requested','approved','sourcing','released'].includes(r.status))
      .map(r=>`${r.item} x${r.qty} to ${r.loc||'unspecified location'} (${r.forNeed})`);
    const lowItems=S.kamalig.inventory.filter(i=>i.qty<=i.low).map(i=>i.name);
    return {lead:'Resource picture from KAMALIG:',
      body:`${km.open} open request${km.open===1?'':'s'}, ${km.urgent} urgent. ${urgentReqs.length?'Urgent and still open: '+urgentReqs.join('; ')+'. ':''}The storehouse is low on ${lowItems.length?lowItems.join(', '):'nothing right now'}. Approve the urgent ones first, release from stock where you can, and route the short items through Liaison.`,
      ref:`<b>Source</b> KAMALIG requests and storehouse inventory.`};
  }
  if(ql.includes('sweep')||ql.includes('search')||ql.includes('clear')){
    return {lead:'Buildings still needing a sweep, worst structural status first:',
      body:unswept.length? unswept.join(', ')+'. Send search teams to the unsafe structures only after the Safety Officer clears entry.' : 'All buildings are cleared. Shift to a shelter-in-place accountability check.',
      ref:`<b>Source</b> SIPAT rollup · ${cr.cleared}/${cr.total} cleared, ${cr.searching} searching.`};
  }
  if(ql.includes('priorit')||ql.includes('now')||ql.includes('next')){
    const p=[];
    if(unsafe.length) p.push(`Hold entry on ${unsafe.join(', ')} until structural triage confirms it is safe.`);
    if(assistB.length) p.push(`Move rescue resources toward ${assistB.join(', ')}, which flag assistance needed.`);
    if(km.urgent) p.push(`Clear ${km.urgent} urgent resource request${km.urgent===1?'':'s'} in KAMALIG, approving and sourcing before anything else.`);
    if(it.missing>0) p.push(`Reconcile ${it.missing} missing against the last-known area in iTALA.`);
    p.push('Set the next operational period objective around finishing the sweep and confirming a full head count.');
    return {lead:'Suggested IMT priorities for this operational period:',
      body:'<ul>'+p.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>',
      ref:`<b>Source</b> iTALA, SIPAT (${cr.unsafe} unsafe, ${cr.assist} assist), and KAMALIG (${km.open} open, ${km.urgent} urgent).`};
  }
  if(ql.includes('account')||ql.includes('gap')||ql.includes('missing')){
    const gap=it.registered-it.present;
    return {lead:'Accountability read across the tools:',
      body:`iTALA shows ${it.present} present of ${it.registered} registered, a gap of ${gap}, with ${it.missing} formally missing and ${it.injured} injured. SIPAT still has ${cr.occ} occupants recorded inside buildings during the sweep. Reconcile that field count against the gap before you report a number to command.`,
      ref:`<b>Source</b> iTALA board and SIPAT campus rollup.`};
  }
  if(ql.includes('201')||ql.includes('sitrep')||ql.includes('summary')||ql.includes('report')){
    return {lead:'ICS-201 current situation line, ready to read on the radio:',
      body:`"${S.incident.name}. ${it.present} of ${it.registered} accounted for, ${it.injured} injured, ${it.missing} missing. ${cr.cleared} of ${cr.total} buildings cleared, ${cr.searching} in progress, ${cr.unsafe} unsafe. ${km.open} resource requests open, ${km.urgent} urgent."`,
      ref:`<b>Note</b> Draft only. Confirm figures with the Planning Section before transmitting.`};
  }
  return {lead:'Here is the current combined picture.',
    body:`People: ${it.present}/${it.registered} present, ${it.injured} injured, ${it.missing} missing (iTALA). Field: ${cr.cleared}/${cr.total} buildings cleared, ${cr.searching} searching, ${cr.unsafe} unsafe, ${cr.assist} requesting assistance (SIPAT). Resources: ${km.open} open requests, ${km.urgent} urgent (KAMALIG). Ask about priorities, remaining sweeps, accountability gaps, resource gaps, or a report line.`,
    ref:`<b>Mode</b> ${S.mode.toUpperCase()}.`};
}
